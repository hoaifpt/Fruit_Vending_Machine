name: Backend tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - 'api-contract/**'
      - 'docs/**'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [dev, main, 'feature/**', 'fix/**']
    paths:
      - 'backend/**'
      - 'api-contract/**'
      - 'docs/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Java 21 / PostgreSQL 18 integration and regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
        shell: bash
    env:
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify Docker runtime
        run: docker info
      - name: Build and run all unit and integration tests
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload test reports even on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
