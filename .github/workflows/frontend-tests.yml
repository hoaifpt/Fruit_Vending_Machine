name: Frontend tests

on:
  pull_request:
    branches: [dev, main, 'feature/integrate-esp32-firmware']
    paths:
      - 'apps/web/**'
      - 'api-contract/**'
      - '.github/workflows/frontend-tests.yml'
  push:
    branches: [dev, main, 'feature/**', 'fix/**']
    paths:
      - 'apps/web/**'
      - 'api-contract/**'
      - '.github/workflows/frontend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Verify generated API types are current
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Retain failed browser traces
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: purchase-browser-traces
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
