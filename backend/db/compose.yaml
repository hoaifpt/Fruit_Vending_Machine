name: fruit-machine-db

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-fruit_machine}
      POSTGRES_USER: ${DB_USER:-fruit_machine}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
    ports:
      - "${DB_HOST:-127.0.0.1}:${DB_PORT:-5433}:5432"
    volumes:
      - database:/var/lib/postgresql
      - ./dev:/db/dev:ro
      - ./verify:/db/verify:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30

  flyway:
    image: redgate/flyway:11.20.1
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-fruit_machine}
      FLYWAY_USER: ${DB_USER:-fruit_machine}
      FLYWAY_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_CLEAN_DISABLED: "true"
    volumes:
      - ../src/main/resources/db/migration:/flyway/sql:ro
    command: migrate

volumes:
  database:
