spring:
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
  sql:
    init:
      mode: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  order:
    expiry-sweep:
      # The sweep is invoked directly by tests with a controlled clock.
      enabled: false
  maintenance-schedule:
    # Tests call MaintenancePlanScheduler.runOnce directly.
    enabled: false
  work-order:
    overdue:
      # Tests call WorkOrderOverdueJob.runOnce directly with a controlled time.
      enabled: false
  maintenance-command:
    dispatcher:
      # Tests call MaintenanceCommandService.expireOrResend directly with a controlled clock.
      enabled: false
  dispense:
    sweep:
      # Tests call DispenseService.expireOrResend directly.
      enabled: false
  health-check:
    # Tests call MachineHealthCheckRunner.runOnce directly with a controlled clock.
    enabled: false
