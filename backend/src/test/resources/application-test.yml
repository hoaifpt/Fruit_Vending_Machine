spring:
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
  sql:
    init:
      mode: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  order:
    expiry-sweep:
      # The sweep is invoked directly by tests with a controlled clock.
      enabled: false
  mqtt:
    # Tests never need a broker; MQTT suites enable it explicitly against a Testcontainers Mosquitto.
    enabled: false
