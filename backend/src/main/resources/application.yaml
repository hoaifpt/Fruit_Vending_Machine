spring:
  application:
    name: fruit-machine-backend
  # Supports running Maven from the module or from the repository root.
  config:
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:fruit_machine}
    username: ${DB_USER:fruit_machine}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
  sql:
    init:
      mode: never
