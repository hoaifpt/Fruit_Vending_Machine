spring:
  application:
    name: fruit-machine-backend
  # Supports running Maven from the module or from the repository root.
  config:
    # APP_DOTENV_IMPORT lets tests disable the developer .env (see pom.xml surefire); unset in normal runs.
    import: "${APP_DOTENV_IMPORT:optional:file:../.env[.properties],optional:file:.env[.properties]}"
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:fruit_machine}
    username: ${DB_USER:fruit_machine}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never

app:
  dispense:
    timeout: ${DISPENSE_TIMEOUT:PT2M}
    sweep-enabled: ${DISPENSE_SWEEP_ENABLED:true}
    sweep-interval: ${DISPENSE_SWEEP_INTERVAL:PT15S}
  bootstrap:
    admin:
      email: ${INITIAL_ADMIN_EMAIL:}
      password: ${INITIAL_ADMIN_PASSWORD:}
      full-name: ${INITIAL_ADMIN_FULL_NAME:Initial Administrator}
  account:
    password:
      min-length: ${PASSWORD_MIN_LENGTH:12}
  payment:
    provider: ${PAYMENT_PROVIDER:MOCK}
    attempt-ttl: ${PAYMENT_ATTEMPT_TTL:PT5M}
    min-remaining-hold: ${PAYMENT_MIN_REMAINING_HOLD:PT30S}
    max-attempts-per-order: ${PAYMENT_MAX_ATTEMPTS_PER_ORDER:5}
    provider-timeout: ${PAYMENT_PROVIDER_TIMEOUT:PT10S}
    mock:
      # HMAC secret that signs MOCK webhooks (development/tests only). Blank means every MOCK webhook fails verification.
      webhook-secret: ${PAYMENT_MOCK_WEBHOOK_SECRET:}
    # Required only when PAYMENT_PROVIDER=PAYOS; no credential has a default value.
    payos:
      base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
      client-id: ${PAYOS_CLIENT_ID:}
      api-key: ${PAYOS_API_KEY:}
      checksum-key: ${PAYOS_CHECKSUM_KEY:}
      return-url: ${PAYOS_RETURN_URL:}
      cancel-url: ${PAYOS_CANCEL_URL:}
      description-prefix: ${PAYOS_DESCRIPTION_PREFIX:FV}
      description-max-length: ${PAYOS_DESCRIPTION_MAX_LENGTH:9}
      cancel-timeout: ${PAYOS_CANCEL_TIMEOUT:PT3S}
  order:
    reservation-ttl: ${ORDER_RESERVATION_TTL:PT5M}
    expiry-sweep:
      enabled: ${ORDER_EXPIRY_SWEEP_ENABLED:true}
      interval: ${ORDER_EXPIRY_SWEEP_INTERVAL:PT30S}
      batch-size: ${ORDER_EXPIRY_SWEEP_BATCH_SIZE:50}

security:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

# Opt in locally; production profile always disables documentation.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    persist-authorization: false
    disable-swagger-default-url: true
  paths-to-match: /api/v1/**
  override-with-generic-response: false
