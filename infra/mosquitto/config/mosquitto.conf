# Local development broker for the Fruit Vending Machine (issue #43). Not a production configuration:
# production uses TLS on 8883 (listener 8883 + cafile/certfile/keyfile), the same auth/ACL model and no anonymous access.
listener 1883 0.0.0.0
allow_anonymous false

# Generated by generate-passwd.sh from the ignored root .env; never committed.
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Keeps QoS 1 messages for the backend's persistent session (clean-session=false) across broker restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
