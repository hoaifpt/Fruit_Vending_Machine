# Staging broker (issue #59): MQTT only over TLS 1.2+ on 8883. The local mosquitto.conf (plaintext 1883) is for development only.
# Certificates: /etc/fruit-mqtt/certs on the host, mounted read-only (infra/docker-compose.staging.yml, renewed by renew-hook.sh).
per_listener_settings false
allow_anonymous false
# Created by add-user.sh / add-user.ps1, ignored by Git.
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Internal only: health checks with docker exec inside the container. Bound to the container loopback, never published.
listener 1883 127.0.0.1

listener 8883 0.0.0.0
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
# Minimum version; TLS 1.3 is negotiated when both sides support it.
tls_version tlsv1.2
# Machines and the backend authenticate with username + password over TLS; no client certificates.
require_certificate false

persistence false
# stderr is unbuffered: docker logs shows connections at once (stdout is block-buffered without a TTY).
log_dest stderr
log_type error
log_type warning
log_type notice
connection_messages true
