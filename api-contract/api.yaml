    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, password, fullName]
      description: Create an ACTIVE STAFF account. Only these four fields are accepted; roles/status are server controlled.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
          description: Login email; stripped and lowercased before validation and persistence.
          example: staff@example.com
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 72
          description: Unmodified password. Shared PASSWORD_MIN_LENGTH policy (default 12 Unicode code points); at most 72 UTF-8 bytes.
        fullName:
          type: string
          minLength: 1
          maxLength: 200
          description: Nonblank display name, stripped before saving.
          example: Nguyen Van A
        phone:
          type: [string, 'null']
          maxLength: 32
          description: Optional contact phone, maximum 32 characters; null clears it.
          minLength: 0
          example: '0901234567'
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [fullName]
      description: Replace profile fields only. Email, password, roles, status and persistence fields are rejected.
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 200
          description: Nonblank display name, stripped before saving.
          example: Nguyen Van B
        phone:
          type: [string, 'null']
          maxLength: 32
          description: Optional contact phone; omitted/null clears it (PUT replacement).
          minLength: 0
          example: '0912345678'
    UpdateUserStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      description: Change account availability. Self-disable/lock and removing the last ACTIVE ADMIN are conflicts.
      properties:
        status:
          type: string
          enum: [ACTIVE, INACTIVE, LOCKED]
          description: ACTIVE = usable; INACTIVE = disabled; LOCKED = blocked.
          example: INACTIVE
    UserResponse:
      type: object
      required: [id, email, fullName, status, roles, createdAt, updatedAt]
      description: Safe account profile. No credentials or tokens. Timestamps are UTC instants.
      properties:
        id: {type: string, format: uuid, description: Account UUID.}
        email: {type: string, format: email, description: Normalized login email.}
        fullName: {type: string, description: Display name.}
        phone: {type: [string, 'null'], description: Optional contact phone.}
        status:
          type: string
          enum: [ACTIVE, INACTIVE, LOCKED]
          description: Current account availability.
        roles:
          type: array
          uniqueItems: true
          description: Distinct current role names, including ADMIN/STAFF; existing extensible roles are preserved.
          items: {type: string}
        createdAt: {type: string, format: date-time, description: Account creation instant.}
        updatedAt: {type: string, format: date-time, description: Last profile/status modification instant.}
    UserPageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      description: Database-paginated accounts, ordered by createdAt descending then UUID ascending.
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/UserResponse'}
        page: {type: integer, format: int32, minimum: 0, description: Zero-based page index.}
        size: {type: integer, format: int32, minimum: 1, maximum: 100, description: Requested page size.}
        totalElements: {type: integer, format: int64, minimum: 0, description: Total matching accounts.}
        totalPages: {type: integer, format: int32, minimum: 0, description: Total pages.}
    ApiResponseUserResponse:
      type: object
      properties:
        timestamp: {type: string, format: date-time}
        message: {type: string}
        data: {$ref: '#/components/schemas/UserResponse'}
    ApiResponseUserPageResponse:
      type: object
      properties:
        timestamp: {type: string, format: date-time}
        message: {type: string}
        data: {$ref: '#/components/schemas/UserPageResponse'}
    LoginRequest:
      type: object
      required: [email, password]
      description: Management account login. Email is stripped and lowercased; password is not modified.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
          description: Account email (maximum 254 characters); must be nonblank and well formed.
          example: developer@example.com
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 72
          description: Account password; nonblank; at most 72 UTF-8 bytes as well as 72 characters.
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: Signed HS256 JWT access token. Never log or share it.
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          format: int64
          minimum: 1
          maximum: 86400
          description: Access token lifetime in seconds
          example: 3600
    ApiResponseLoginResponse:
      type: object
      properties:
        timestamp: {type: string, format: date-time}
        message: {type: string}
        data:
          $ref: '#/components/schemas/LoginResponse'
    ApiErrorResponse:
      type: object
      properties:
        timestamp: {type: string, format: date-time}
        status: {type: integer, format: int32}
        error: {type: string}
        message: {type: string}
        path: {type: string}
        fieldErrors:
          type: object
          description: Optional field-to-validation-message map; omitted when empty. No rejected values.
          additionalProperties: {type: string}
