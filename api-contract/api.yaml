  "/api/v1/machines/{machineId}/slots/{slotId}/inventory/summary":
    "get":
      "tags":
        - "Inventory"
      "summary": "Get physical/available/sellable slot counts"
      "description": "ADMIN or STAFF. Scoped machine/slot validation. DB aggregates at asOf, no stock counters: occupied includes AVAILABLE/RESERVED/EXPIRED/DISPENSE_FAILED; available requires AVAILABLE+unexpired; sellable additionally ACTIVE product/machine/slot. ExpiredCount includes physically present boxes with past batch expiry or EXPIRED status. Remaining capacity=max(0,capacity-occupied). headStatus/headExpired describe the slot head (bottom bowl, dispensed next: earliest loadedAt, tie-break id); a head that is not AVAILABLE and unexpired blocks the whole column for ordering. Counts and head share one REPEATABLE READ snapshot."
