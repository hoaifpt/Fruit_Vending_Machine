  "/api/v1/machines/{machineId}/slots/{slotId}/inventory/summary":
    "get":
      "tags":
        - "Inventory"
      "summary": "Get physical/available/sellable slot counts"
      "description": "ADMIN or STAFF. Scoped machine/slot validation. DB aggregates at asOf, no stock counters: occupied includes AVAILABLE/RESERVED/EXPIRED/DISPENSE_FAILED; available requires AVAILABLE+unexpired; sellable additionally ACTIVE product/machine/slot. ExpiredCount includes physically present boxes with past batch expiry or EXPIRED status. Remaining capacity=max(0,capacity-occupied)."
      "operationId": "getSlotInventorySummary"
      "parameters":
        -
          "name": "machineId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "slotId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "responses":
        "400":
          "description": "Invalid parameters, malformed/unknown JSON or validation failure"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "message": "Request body is missing or malformed"
                "timestamp": "2026-10-10T02:00:00Z"
                "error": "Bad Request"
                "path": "/api/v1/machines/{machineId}/slots/{slotId}/inventory/summary"
                "status": 400
        "401":
          "description": "Missing/invalid/expired Bearer token or unavailable account"
          "headers":
            "WWW-Authenticate":
              "schema":
                "type": "string"
                "const": "Bearer"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "message": "Authentication required or access token invalid"
                "timestamp": "2026-10-10T02:00:00Z"
                "error": "Unauthorized"
                "path": "/api/v1/machines/{machineId}/slots/{slotId}/inventory/summary"
                "status": 401
        "403":
          "description": "Authenticated account lacks ADMIN/STAFF role"
          "content":
            "application/json":
