                message: "Product not found"
                status: 404
                path: "/api/v1/products/{id}/status"
        "500":
          description: "Unexpected server error; no internal details"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Internal Server Error"
                timestamp: "2026-10-06T00:00:00Z"
                message: "An unexpected error occurred"
                status: 500
                path: "/api/v1/products/{id}/status"
      security:
        -
          bearerAuth: []
  "/api/v1/products":
    get:
      tags:
        - "Products"
      summary: "List/search catalog products"
      description: "ADMIN or STAFF. Database pagination with combined optional status and case-insensitive literal substring search on name/SKU. Default page 0, size 20; maximum size 100. One sort field/direction using Spring conventions, default createdAt,desc; UUID ascending tie-break. Both statuses are visible by default; out-of-range pages are empty."
      operationId: "listProducts"
      parameters:
        -
          name: "page"
          in: "query"
          description: "Zero-based page index."
          required: false
          schema:
            type: "integer"
            format: "int32"
            default: 0
            minimum: 0
        -
          name: "size"
          in: "query"
          description: "Page size, 1 to 100."
          required: false
          schema:
            type: "integer"
            format: "int32"
            default: 20
            maximum: 100
            minimum: 1
        -
          name: "status"
          in: "query"
          description: "Optional ACTIVE or INACTIVE filter."
          required: false
          schema:
            type: "string"
            enum:
              - "ACTIVE"
              - "INACTIVE"
        -
          name: "search"
          in: "query"
          description: "Optional literal substring of name/SKU, case-insensitive, stripped; blank means no filter. Maximum 200 characters."
          required: false
          schema:
            type: "string"
            maxLength: 200
            minLength: 0
        -
          name: "sort"
          in: "query"
          description: "One approved field: id, sku, name, price, status, createdAt, updatedAt; optional asc/desc (asc when omitted). Example name,asc."
          required: false
          schema:
            type: "string"
            default: "createdAt,desc"
      responses:
        "200":
          description: "Paginated catalog products"
          headers:
            Cache-Control:
              schema:
                type: "string"
                const: "no-store"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiResponseProductPageResponse"
              example:
                timestamp: "2026-10-06T00:00:00Z"
                data:
                  content:
                    -
                      status: "ACTIVE"
                      sku: "MANGO-BOX-001"
                      id: "c6a33ea7-0c1c-4bbf-a890-3b7286d10a02"
                      imageUrl: "https://example.com/products/mango.jpg"
                      price: 35000
                      name: "Mango Fruit Box"
                      updatedAt: "2026-10-06T00:00:00Z"
                      createdAt: "2026-10-06T00:00:00Z"
                      description: "Fresh prepared mango"
                  size: 20
                  page: 0
                  totalPages: 1
                  totalElements: 1
                message: "Products retrieved"
        "400":
          description: "Invalid parameters, validation failure or malformed/unknown JSON fields"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Bad Request"
                timestamp: "2026-10-06T00:00:00Z"
                message: "Request body is missing or malformed"
                status: 400
                path: "/api/v1/products"
        "401":
          description: "Missing/invalid/expired Bearer token or unavailable account"
          headers:
            WWW-Authenticate:
              schema:
                type: "string"
                const: "Bearer"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Unauthorized"
                timestamp: "2026-10-06T00:00:00Z"
                message: "Authentication required or access token invalid"
                status: 401
                path: "/api/v1/products"
        "403":
          description: "Authenticated account lacks the required role"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Forbidden"
                timestamp: "2026-10-06T00:00:00Z"
                message: "Access denied"
                status: 403
                path: "/api/v1/products"
        "500":
          description: "Unexpected server error; no internal details"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Internal Server Error"
                timestamp: "2026-10-06T00:00:00Z"
                message: "An unexpected error occurred"
                status: 500
                path: "/api/v1/products"
      security:
        -
          bearerAuth: []
    post:
      tags:
        - "Products"
      summary: "Create catalog product"
      description: "ADMIN only. Creates ACTIVE product with stripped/uppercased unique SKU and positive BigDecimal price. Only sku/name/description/price/imageUrl are accepted. Status/id/timestamps/batch/inventory fields are rejected. Price is at most 9999999999.99 and two decimal places; no silent rounding. Database UNIQUE protects concurrent creates."
      operationId: "createProduct"
      requestBody:
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CreateProductRequest"
            example:
              price: 35000
              imageUrl: "https://example.com/products/mango.jpg"
              name: "Mango Fruit Box"
              description: "Fresh prepared mango"
              sku: "MANGO-BOX-001"
        required: true
      responses:
        "201":
          description: "ACTIVE product created; Location points to the product"
          headers:
            Cache-Control:
              schema:
                type: "string"
                const: "no-store"
            Location:
              description: "Relative URL of the created product."
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiResponseProductResponse"
              example:
                timestamp: "2026-10-06T00:00:00Z"
                data:
                  createdAt: "2026-10-06T00:00:00Z"
                  price: 35000
                  imageUrl: "https://example.com/products/mango.jpg"
                  name: "Mango Fruit Box"
                  description: "Fresh prepared mango"
                  id: "c6a33ea7-0c1c-4bbf-a890-3b7286d10a02"
                  sku: "MANGO-BOX-001"
                  status: "ACTIVE"
                  updatedAt: "2026-10-06T00:00:00Z"
                message: "Product created"
        "400":
          description: "Invalid parameters, validation failure or malformed/unknown JSON fields"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Bad Request"
                timestamp: "2026-10-06T00:00:00Z"
                message: "Request body is missing or malformed"
                status: 400
                path: "/api/v1/products"
        "401":
          description: "Missing/invalid/expired Bearer token or unavailable account"
          headers:
            WWW-Authenticate:
              schema:
                type: "string"
                const: "Bearer"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Unauthorized"
                timestamp: "2026-10-06T00:00:00Z"
                message: "Authentication required or access token invalid"
                status: 401
                path: "/api/v1/products"
        "403":
          description: "Authenticated account lacks the required role"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Forbidden"
                timestamp: "2026-10-06T00:00:00Z"
                message: "Access denied"
                status: 403
                path: "/api/v1/products"
        "409":
          description: "SKU already exists or concurrent database uniqueness conflict"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Conflict"
                timestamp: "2026-10-06T00:00:00Z"
                message: "SKU is already in use"
                status: 409
                path: "/api/v1/products"
        "500":
          description: "Unexpected server error; no internal details"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Internal Server Error"
                timestamp: "2026-10-06T00:00:00Z"
                message: "An unexpected error occurred"
                status: 500
                path: "/api/v1/products"
      security:
        -
          bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Paste the access token only (without the Bearer prefix).
  schemas:
    "UpdateMachineRequest":
      "type": "object"
      "additionalProperties": false
      "description": "Replace machine configuration only; code/status/lastSeenAt/identity/timestamps rejected."
      "properties":
        "name":
          "type": "string"
          "description": "Nonblank machine name, stripped."
          "example": "Fruit Machine - Campus A"
          "maxLength": 200
          "minLength": 1
        "location":
          "type": "string"
          "description": "Nonblank installation location, stripped."
          "example": "Building A - Ground Floor"
          "maxLength": 500
          "minLength": 1
        "minTemperature":
          "type": "number"
          "description": "Minimum configured Celsius threshold, strictly below maxTemperature; at most two decimals."
          "example": 2.0
          "maximum": 100
          "minimum": -100
          "multipleOf": 0.01
        "maxTemperature":
          "type": "number"
          "description": "Maximum configured Celsius threshold, strictly above minTemperature; at most two decimals."
          "example": 8.0
          "maximum": 100
          "minimum": -100
          "multipleOf": 0.01
        "minHumidity":
          "type": "number"
          "description": "Minimum configured humidity percentage, strictly below maxHumidity; at most two decimals."
          "example": 40.0
          "maximum": 100
          "minimum": 0
          "multipleOf": 0.01
        "maxHumidity":
          "type": "number"
          "description": "Maximum configured humidity percentage, strictly above minHumidity; at most two decimals."
          "example": 80.0
          "maximum": 100
          "minimum": 0
          "multipleOf": 0.01
      "required":
        - "location"
        - "maxHumidity"
        - "maxTemperature"
        - "minHumidity"
        - "minTemperature"
        - "name"
    "ApiResponseMachineResponse":
      "type": "object"
      "properties":
        "timestamp":
          "type": "string"
          "format": "date-time"
        "message":
          "type": "string"
        "data":
          "$ref": "#/components/schemas/MachineResponse"
    "MachineResponse":
      "type": "object"
      "description": "Machine identity, administrative status and environmental configuration; no slot/inventory/telemetry collections."
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
          "description": "Machine UUID."
        "code":
          "type": "string"
          "description": "Immutable business code."
          "example": "FV-HCM-001"
        "name":
          "type": "string"
          "description": "Machine name."
        "location":
          "type":
            - "string"
            - "null"
          "description": "Installation location; legacy database rows may be null."
        "status":
          "type": "string"
          "description": "Administrative status, not connectivity."
          "enum":
            - "ACTIVE"
            - "INACTIVE"
            - "MAINTENANCE"
        "minTemperature":
          "type": "number"
          "description": "Configured minimum Celsius threshold."
        "maxTemperature":
          "type": "number"
          "description": "Configured maximum Celsius threshold."
        "minHumidity":
          "type": "number"
          "description": "Configured minimum humidity percentage."
        "maxHumidity":
          "type": "number"
          "description": "Configured maximum humidity percentage."
        "lastSeenAt":
          "type":
            - "string"
            - "null"
          "format": "date-time"
          "description": "System-managed last communication instant, UTC; null until heartbeat exists. Read-only."
        "createdAt":
          "type": "string"
          "format": "date-time"
          "description": "Creation instant, UTC."
        "updatedAt":
          "type": "string"
          "format": "date-time"
          "description": "Modification instant, UTC."
      "required":
        - "code"
        - "createdAt"
        - "id"
        - "maxHumidity"
        - "maxTemperature"
        - "minHumidity"
        - "minTemperature"
        - "name"
        - "status"
        - "updatedAt"
    "CreateMachineRequest":
      "type": "object"
      "additionalProperties": false
      "description": "Register machine, initial status INACTIVE and lastSeenAt null."
      "properties":
        "code":
          "type": "string"
          "description": "Stable unique code, stripped and uppercased with Locale.ROOT."
          "example": "FV-HCM-001"
          "maxLength": 64
          "minLength": 1
        "name":
          "type": "string"
          "description": "Nonblank machine name, stripped."
          "example": "Fruit Machine - Campus A"
          "maxLength": 200
          "minLength": 1
        "location":
          "type": "string"
          "description": "Nonblank installation location, stripped."
          "example": "Building A - Ground Floor"
          "maxLength": 500
          "minLength": 1
        "minTemperature":
          "type": "number"
          "description": "Minimum configured Celsius threshold, strictly below maxTemperature; at most two decimals."
          "example": 2.0
          "maximum": 100
          "minimum": -100
          "multipleOf": 0.01
        "maxTemperature":
          "type": "number"
          "description": "Maximum configured Celsius threshold, strictly above minTemperature; at most two decimals."
          "example": 8.0
          "maximum": 100
          "minimum": -100
          "multipleOf": 0.01
        "minHumidity":
          "type": "number"
          "description": "Minimum configured humidity percentage, strictly below maxHumidity; at most two decimals."
          "example": 40.0
          "maximum": 100
          "minimum": 0
          "multipleOf": 0.01
        "maxHumidity":
          "type": "number"
          "description": "Maximum configured humidity percentage, strictly above minHumidity; at most two decimals."
          "example": 80.0
          "maximum": 100
          "minimum": 0
          "multipleOf": 0.01
      "required":
        - "code"
        - "location"
        - "maxHumidity"
        - "maxTemperature"
        - "minHumidity"
        - "minTemperature"
        - "name"
    "UpdateMachineStatusRequest":
      "type": "object"
      "additionalProperties": false
      "description": "Set administrative machine status without deleting histories."
      "properties":
        "status":
          "type": "string"
          "description": "ACTIVE, INACTIVE or MAINTENANCE; administrative configuration, not connectivity."
          "enum":
            - "ACTIVE"
            - "INACTIVE"
            - "MAINTENANCE"
          "example": "MAINTENANCE"
      "required":
        - "status"
    "ApiResponseMachinePageResponse":
      "type": "object"
      "properties":
        "timestamp":
          "type": "string"
          "format": "date-time"
        "message":
          "type": "string"
        "data":
          "$ref": "#/components/schemas/MachinePageResponse"
    "MachinePageResponse":
      "type": "object"
      "description": "Database-paginated machines matching combined status/search filters."
      "properties":
        "content":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/MachineResponse"
        "page":
          "type": "integer"
          "format": "int32"
          "description": "Zero-based page index."
          "minimum": 0
        "size":
          "type": "integer"
          "format": "int32"
          "description": "Requested page size."
          "maximum": 100
          "minimum": 1
        "totalElements":
          "type": "integer"
          "format": "int64"
          "description": "Total matching machines."
          "minimum": 0
        "totalPages":
          "type": "integer"
          "format": "int32"
          "description": "Total pages."
          "minimum": 0
      "required":
        - "content"
        - "page"
        - "size"
        - "totalElements"
        - "totalPages"
    UpdateProductRequest:
      type: "object"
      additionalProperties: false
      description: "Replace catalog fields only. SKU/status/identity/timestamps are rejected."
      properties:
        name:
          type: "string"
          description: "Nonblank catalog name, stripped before saving."
          example: "Mango Fruit Box"
          maxLength: 200
          minLength: 1
        description:
          type:
            - "string"
            - "null"
          description: "Optional catalog description; omitted/null clears it."
          example: "Fresh prepared mango"
        price:
          type: "number"
          description: "Positive catalog price, maximum 9999999999.99, at most two decimal places; historical prices unchanged."
          example: 35000
          multipleOf: 0.01
          exclusiveMinimum: 0
          maximum: 9999999999.99
        imageUrl:
          type:
            - "string"
            - "null"
          description: "Optional image reference; omitted/null clears it. Maximum 2048 characters."
          example: "https://example.com/products/mango.jpg"
          maxLength: 2048
          minLength: 0
      required:
        - "name"
        - "price"
    ApiResponseProductResponse:
      type: "object"
      properties:
        timestamp:
          type: "string"
          format: "date-time"
        message:
          type: "string"
        data:
          "$ref": "#/components/schemas/ProductResponse"
    ProductResponse:
      type: "object"
      description: "Catalog definition only; no batch/inventory/slot or history collections."
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "Product UUID."
        sku:
          type: "string"
          description: "Immutable SKU."
          example: "MANGO-BOX-001"
        name:
          type: "string"
          description: "Catalog name."
          example: "Mango Fruit Box"
        description:
          type:
            - "string"
            - "null"
          description: "Optional description."
        price:
          type: "number"
          description: "Current catalog price; historical order/payment snapshots unchanged."
          example: 35000
        imageUrl:
          type:
            - "string"
            - "null"
          description: "Optional image reference."
        status:
          type: "string"
          description: "Current catalog availability."
          enum:
            - "ACTIVE"
            - "INACTIVE"
        createdAt:
          type: "string"
          format: "date-time"
          description: "Creation instant in UTC."
        updatedAt:
          type: "string"
          format: "date-time"
          description: "Last modification instant in UTC."
      required:
        - "createdAt"
        - "id"
        - "name"
        - "price"
        - "sku"
        - "status"
        - "updatedAt"
    UpdateProductStatusRequest:
      type: "object"
      additionalProperties: false
      description: "Activate/deactivate catalog product without deleting histories."
      properties:
        status:
          type: "string"
          description: "ACTIVE permits future use; INACTIVE disables new use without deletion."
          enum:
            - "ACTIVE"
            - "INACTIVE"
          example: "INACTIVE"
      required:
        - "status"
    ProductPageResponse:
      type: "object"
      description: "Database-paginated catalog matching combined status/search filters."
      properties:
        content:
          type: "array"
          items:
            "$ref": "#/components/schemas/ProductResponse"
        page:
          type: "integer"
          format: "int32"
          description: "Zero-based page index."
          minimum: 0
        size:
          type: "integer"
          format: "int32"
          description: "Requested page size."
          maximum: 100
          minimum: 1
        totalElements:
          type: "integer"
          format: "int64"
          description: "Total matching products."
          minimum: 0
        totalPages:
          type: "integer"
          format: "int32"
          description: "Total pages."
          minimum: 0
      required:
        - "content"
        - "page"
        - "size"
        - "totalElements"
        - "totalPages"
    ApiResponseProductPageResponse:
      type: "object"
      properties:
        timestamp:
          type: "string"
          format: "date-time"
        message:
          type: "string"
        data:
          "$ref": "#/components/schemas/ProductPageResponse"
    CreateProductRequest:
      type: "object"
      additionalProperties: false
      description: "Create catalog product; status is server-controlled ACTIVE."
      properties:
        sku:
          type: "string"
          description: "Stable unique SKU, stripped and uppercased with Locale.ROOT before validation."
          example: "MANGO-BOX-001"
          maxLength: 64
          minLength: 1
        name:
          type: "string"
          description: "Nonblank catalog name, stripped before saving."
          example: "Mango Fruit Box"
          maxLength: 200
          minLength: 1
        description:
          type:
            - "string"
            - "null"
          description: "Optional catalog description; null clears it."
          example: "Fresh prepared mango"
        price:
          type: "number"
          description: "Positive catalog price, maximum 9999999999.99, at most two decimal places; never rounded."
          example: 35000
          multipleOf: 0.01
          exclusiveMinimum: 0
          maximum: 9999999999.99
        imageUrl:
          type:
            - "string"
            - "null"
          description: "Optional image reference, maximum 2048 characters. No upload or URL fetching."
          example: "https://example.com/products/mango.jpg"
          maxLength: 2048
          minLength: 0
      required:
        - "name"
        - "price"
        - "sku"
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, password, fullName]
      description: Create an ACTIVE STAFF account. Only these four fields are accepted; roles/status are server controlled.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
          description: Login email; stripped and lowercased before validation and persistence.
          example: staff@example.com
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 72
          description: Unmodified password. Shared PASSWORD_MIN_LENGTH policy (default 12 Unicode code points); at most 72 UTF-8 bytes.
        fullName:
          type: string
          minLength: 1
          maxLength: 200
          description: Nonblank display name, stripped before saving.
          example: Nguyen Van A
        phone:
          type: [string, 'null']
          maxLength: 32
          description: Optional contact phone, maximum 32 characters; null clears it.
          minLength: 0
          example: '0901234567'
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [fullName]
      description: Replace profile fields only. Email, password, roles, status and persistence fields are rejected.
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 200
          description: Nonblank display name, stripped before saving.
          example: Nguyen Van B
        phone:
          type: [string, 'null']
          maxLength: 32
          description: Optional contact phone; omitted/null clears it (PUT replacement).
          minLength: 0
          example: '0912345678'
    UpdateUserStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      description: Change account availability. Self-disable/lock and removing the last ACTIVE ADMIN are conflicts.
      properties:
        status:
          type: string
          enum: [ACTIVE, INACTIVE, LOCKED]
          description: ACTIVE = usable; INACTIVE = disabled; LOCKED = blocked.
          example: INACTIVE
    UserResponse:
      type: object
      required: [id, email, fullName, status, roles, createdAt, updatedAt]
      description: Safe account profile. No credentials or tokens. Timestamps are UTC instants.
      properties:
        id: {type: string, format: uuid, description: Account UUID.}
        email: {type: string, format: email, description: Normalized login email.}
        fullName: {type: string, description: Display name.}
        phone: {type: [string, 'null'], description: Optional contact phone.}
        status:
          type: string
          enum: [ACTIVE, INACTIVE, LOCKED]
          description: Current account availability.
        roles:
          type: array
          uniqueItems: true
          description: Distinct current role names, including ADMIN/STAFF; existing extensible roles are preserved.
          items: {type: string}
        createdAt: {type: string, format: date-time, description: Account creation instant.}
        updatedAt: {type: string, format: date-time, description: Last profile/status modification instant.}
    UserPageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      description: Database-paginated accounts, ordered by createdAt descending then UUID ascending.
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/UserResponse'}
        page: {type: integer, format: int32, minimum: 0, description: Zero-based page index.}
        size: {type: integer, format: int32, minimum: 1, maximum: 100, description: Requested page size.}
        totalElements: {type: integer, format: int64, minimum: 0, description: Total matching accounts.}
        totalPages: {type: integer, format: int32, minimum: 0, description: Total pages.}
    ApiResponseUserResponse:
      type: object
      properties:
        timestamp: {type: string, format: date-time}
        message: {type: string}
        data: {$ref: '#/components/schemas/UserResponse'}
    ApiResponseUserPageResponse:
      type: object
      properties:
        timestamp: {type: string, format: date-time}
        message: {type: string}
        data: {$ref: '#/components/schemas/UserPageResponse'}
    LoginRequest:
      type: object
      required: [email, password]
      description: Management account login. Email is stripped and lowercased; password is not modified.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
          description: Account email (maximum 254 characters); must be nonblank and well formed.
          example: developer@example.com
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 72
          description: Account password; nonblank; at most 72 UTF-8 bytes as well as 72 characters.
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: Signed HS256 JWT access token. Never log or share it.
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          format: int64
          minimum: 1
          maximum: 86400
          description: Access token lifetime in seconds
          example: 3600
    ApiResponseLoginResponse:
      type: object
      properties:
        timestamp: {type: string, format: date-time}
        message: {type: string}
        data:
          $ref: '#/components/schemas/LoginResponse'
    ApiErrorResponse:
      type: object
      properties:
        timestamp: {type: string, format: date-time}
        status: {type: integer, format: int32}
        error: {type: string}
        message: {type: string}
        path: {type: string}
        fieldErrors:
          type: object
          description: Optional field-to-validation-message map; omitted when empty. No rejected values.
          additionalProperties: {type: string}
