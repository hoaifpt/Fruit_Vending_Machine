              example: {"timestamp":"2026-10-06T00:00:00Z","status":400,"error":"Bad Request","message":"Request body is missing or malformed","path":"/api/v1/users/{id}/status"}
        '401':
          description: Missing/invalid/expired Bearer token or unavailable account
