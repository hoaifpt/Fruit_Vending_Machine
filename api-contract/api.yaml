          "headers":
            "WWW-Authenticate":
              "schema":
                "type": "string"
                "const": "Bearer"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "error": "Unauthorized"
                "timestamp": "2026-10-16T04:00:00Z"
                "message": "Authentication required or access token invalid"
                "status": 401
                "path": "/api/v1/payment-webhook-logs"
        "403":
          "description": "Authenticated account is not ADMIN"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "error": "Forbidden"
                "timestamp": "2026-10-16T04:00:00Z"
                "message": "Access denied"
                "status": 403
                "path": "/api/v1/payment-webhook-logs"
        "500":
          "description": "Unexpected server error; no internal details"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "error": "Internal Server Error"
                "timestamp": "2026-10-16T04:00:00Z"
                "message": "An unexpected error occurred"
                "status": 500
                "path": "/api/v1/payment-webhook-logs"
        "200":
