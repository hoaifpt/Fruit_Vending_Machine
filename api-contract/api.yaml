      "properties":
        "id":
          "type": "string"
          "format": "uuid"
          "description": "Machine UUID."
        "code":
          "type": "string"
          "description": "Immutable business code."
          "example": "FV-HCM-001"
        "name":
          "type": "string"
          "description": "Machine name."
        "location":
          "type":
            - "string"
            - "null"
          "description": "Installation location; legacy database rows may be null."
        "status":
          "type": "string"
          "description": "Administrative status, not connectivity."
          "enum":
            - "ACTIVE"
            - "INACTIVE"
            - "MAINTENANCE"
        "minTemperature":
          "type": "number"
          "description": "Configured minimum Celsius threshold."
        "maxTemperature":
          "type": "number"
          "description": "Configured maximum Celsius threshold."
        "minHumidity":
          "type": "number"
          "description": "Configured minimum humidity percentage."
        "maxHumidity":
          "type": "number"
          "description": "Configured maximum humidity percentage."
        "connectivity":
          "type": "string"
          "description": "Derived from presence, never stored: NEVER_SEEN (no message yet), OFFLINE (Last Will after the last message, or silent more than 180 s), WARNING (silent more than 60 s), otherwise ONLINE. Independent of status; does not block sales."
          "enum":
            - "ONLINE"
            - "WARNING"
            - "OFFLINE"
            - "NEVER_SEEN"
        "lastSeenAt":
          "type":
            - "string"
            - "null"
          "format": "date-time"
          "description": "System-managed instant of the last valid MQTT message except the OFFLINE Last Will, UTC; null until the machine was heard from. Read-only."
        "lastHeartbeatAt":
          "type":
            - "string"
            - "null"
          "format": "date-time"
          "description": "System-managed instant of the last valid heartbeat, UTC; null until the first heartbeat. Read-only."
        "firmwareVersion":
          "type":
            - "string"
            - "null"
          "description": "Firmware version last reported by the machine (heartbeat or status ONLINE). Read-only."
          "example": "0.3.0"
        "uptimeSeconds":
          "type":
            - "integer"
            - "null"
          "format": "int64"
          "description": "Controller uptime in seconds last reported by the machine. Read-only."
          "example": 12345
        "wifiRssi":
          "type":
            - "integer"
            - "null"
          "format": "int32"
          "description": "Wi-Fi signal in dBm (-127 to 0) from the last heartbeat; null when not reported, never 0 by default. Read-only."
          "example": -55
        "freeHeapBytes":
          "type":
            - "integer"
            - "null"
          "format": "int64"
          "description": "Free controller heap in bytes from the last heartbeat; null when not reported. Read-only."
          "example": 18240
        "createdAt":
          "type": "string"
          "format": "date-time"
          "description": "Creation instant, UTC."
        "updatedAt":
          "type": "string"
          "format": "date-time"
          "description": "Modification instant, UTC."
      "required":
        - "code"
        - "connectivity"
        - "createdAt"
        - "id"
        - "maxHumidity"
        - "maxTemperature"
        - "minHumidity"
        - "minTemperature"
        - "name"
        - "status"
        - "updatedAt"
