        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Account UUID.
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
            example: {status: INACTIVE}
      responses:
        '200':
          description: Safe profile with current status
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
