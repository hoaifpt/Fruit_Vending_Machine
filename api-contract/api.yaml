  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Login using email and password
      description: >-
        Public endpoint for existing ACTIVE management accounts with BCrypt password hashes.
        Email is stripped and lowercased before validation. Password is never trimmed or normalized.
        Password must be nonblank, at most 72 characters AND 72 UTF-8 bytes.
        Unknown email, wrong password, INACTIVE and LOCKED accounts return the same generic 401.
        No refresh token. Send the access token as Authorization: Bearer <token> for protected APIs.
        Do not attach an invalid or expired Authorization header to login: the JWT filter rejects it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: developer@example.com
              password: '<your-account-password>'
      responses:
        '200':
          description: Authenticated; response is not cacheable
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
            Pragma:
              schema: {type: string, const: no-cache}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLoginResponse'
              example:
                timestamp: '2026-10-03T00:00:00Z'
                message: Login successful
                data:
                  accessToken: '<access-token>'
                  tokenType: Bearer
                  expiresIn: 3600
        '400':
          description: Missing/malformed JSON or invalid email/password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                timestamp: '2026-10-03T00:00:00Z'
                status: 400
                error: Validation Failed
                message: Request validation failed
                path: /api/v1/auth/login
                fieldErrors:
                  email: must be a well-formed email address
        '401':
          description: Invalid email or password, unavailable account, or invalid Bearer header
          headers:
            WWW-Authenticate:
              schema: {type: string, const: Bearer}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                timestamp: '2026-10-03T00:00:00Z'
                status: 401
                error: Unauthorized
                message: Invalid email or password
                path: /api/v1/auth/login
        '500':
          description: Unexpected server error; no internal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List management users
      description: >-
        ADMIN only. Database pagination with optional combined status/role filters. Stable order: createdAt descending, UUID ascending. Default page 0, size 20; maximum size 100. Returns all account types without credentials. Out-of-range pages are empty.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page index.
          schema: {type: integer, format: int32, minimum: 0, default: 0}
        - name: size
          in: query
          required: false
          description: Page size, 1 to 100.
          schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 20}
        - name: status
          in: query
          required: false
          description: Optional account status filter.
          schema: {type: string, enum: [ACTIVE, INACTIVE, LOCKED]}
        - name: role
          in: query
          required: false
          description: Optional ADMIN or STAFF membership filter; roles remain independent.
          schema: {type: string, enum: [ADMIN, STAFF]}
