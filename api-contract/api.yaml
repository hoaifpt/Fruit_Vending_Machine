  /api/v1/users/{id}/status:
    patch:
      tags: [Users]
      operationId: updateUserStatus
      summary: Change management user status
      description: >-
        ADMIN only. Sets ACTIVE, INACTIVE or LOCKED, preserving the account and its roles/history. INACTIVE/LOCKED immediately prevents login and reuse of issued JWTs. Self-disable/lock and disabling/locking the last ACTIVE ADMIN return 409. Status decisions are serialized and the acting ADMIN is rechecked after obtaining the lock; a concurrently disabled actor receives 403. Same-status requests are idempotent.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Account UUID.
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
            example: {status: INACTIVE}
      responses:
        '200':
          description: Safe profile with current status
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserResponse'
              example: {"timestamp":"2026-10-06T00:00:00Z","message":"User status updated","data":{"id":"c6a33ea7-0c1c-4bbf-a890-3b7286d10a01","email":"staff@example.com","fullName":"Nguyen Van A","phone":"0901234567","status":"INACTIVE","roles":["STAFF"],"createdAt":"2026-10-06T00:00:00Z","updatedAt":"2026-10-06T00:00:00Z"}}
        '400':
