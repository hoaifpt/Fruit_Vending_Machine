          "type": "string"
        "data":
          "$ref": "#/components/schemas/AlertPageResponse"
    "AlertPageResponse":
      "type": "object"
      "description": "Database page of alerts: CRITICAL first, then WARNING, then INFO; newest first within a severity (then id DESC)."
      "properties":
        "content":
          "type": "array"
          "description": "Alerts of this page."
          "items":
            "$ref": "#/components/schemas/AlertResponse"
        "page":
          "type": "integer"
          "format": "int32"
          "description": "Zero-based page index."
        "size":
          "type": "integer"
          "format": "int32"
          "description": "Requested page size."
        "totalElements":
          "type": "integer"
          "format": "int64"
          "description": "Matching alerts."
        "totalPages":
          "type": "integer"
          "format": "int32"
          "description": "Pages of matching alerts."
      "required":
        - "content"
        - "page"
        - "size"
        - "totalElements"
        - "totalPages"
    "AlertResponse":
      "type": "object"
      "description": "One alert. title/message are Vietnamese UI text; type and errorCode let a frontend localize."
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
          "description": "Alert UUID."
        "machineId":
          "type": "string"
          "format": "uuid"
          "description": "Machine UUID."
        "machineCode":
          "type": "string"
          "description": "Machine code."
          "example": "FV-DEV-001"
        "slotId":
          "type":
            - "string"
            - "null"
          "format": "uuid"
          "description": "Slot UUID for slot alerts (stock, expiry, dispense); null for machine alerts."
        "slotCode":
          "type":
            - "string"
            - "null"
          "description": "Slot code (A or B) for slot alerts; null otherwise."
          "example": "A"
        "type":
          "type": "string"
          "description": "Alert type."
          "enum":
            - "HIGH_TEMPERATURE"
            - "LOW_TEMPERATURE"
            - "HIGH_HUMIDITY"
            - "MACHINE_OFFLINE"
            - "PRODUCT_EXPIRED"
            - "PRODUCT_EXPIRING"
            - "DISPENSE_FAILED"
            - "LOW_STOCK"
            - "HARDWARE_FAULT"
        "severity":
          "type": "string"
          "description": "INFO, WARNING or CRITICAL."
          "enum":
            - "INFO"
            - "WARNING"
            - "CRITICAL"
        "errorCode":
          "type":
            - "string"
            - "null"
          "description": "Error code for HARDWARE_FAULT (contract codes, REBOOT_<REASON>, MULTIPLE_BOWLS_DETECTED, UNKNOWN_FAULT) and the failure reason for DISPENSE_FAILED; null otherwise."
          "example": "SERVO_INIT_FAILED"
        "title":
          "type": "string"
          "description": "Short title."
        "message":
          "type":
            - "string"
            - "null"
          "description": "Details."
        "status":
          "type": "string"
          "description": "OPEN, ACKNOWLEDGED or RESOLVED."
          "enum":
            - "OPEN"
            - "ACKNOWLEDGED"
            - "RESOLVED"
        "triggeredAt":
          "type": "string"
          "format": "date-time"
          "description": "When the problem was detected, UTC."
        "acknowledgedAt":
          "type":
            - "string"
