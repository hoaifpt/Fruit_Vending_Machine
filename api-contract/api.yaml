  "/api/v1/work-orders":
    "get":
      "tags":
        - "Work Orders"
      "summary": "List work orders"
      "description": "WORK_ORDER_READ_ALL. Filters: status (repeatable), type, source, machineId, assigneeId, priority, overdue=true, createdAt range (from inclusive, to exclusive). Sorted URGENT, HIGH, NORMAL, LOW, then due time (none last), then oldest; page >= 0, size 1 to 100 (default 20)."
      "operationId": "listWorkOrders"
      "parameters":
        -
          "name": "status"
          "in": "query"
          "description": "Optional statuses (repeat the parameter); default all."
          "required": false
          "schema":
            "type": "array"
            "items":
              "type": "string"
              "enum":
                - "OPEN"
                - "ASSIGNED"
                - "IN_PROGRESS"
                - "DONE"
                - "CANCELLED"
        -
          "name": "type"
          "in": "query"
          "description": "Optional type."
          "required": false
          "schema":
            "type": "string"
            "enum":
              - "RESTOCK"
              - "MAINTENANCE"
              - "INCIDENT"
        -
          "name": "source"
          "in": "query"
          "description": "Optional source."
          "required": false
          "schema":
            "type": "string"
            "enum":
              - "MANUAL"
              - "ALERT"
              - "SCHEDULE"
              - "CUSTOMER_REPORT"
        -
          "name": "machineId"
          "in": "query"
          "description": "Optional machine UUID."
          "required": false
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "assigneeId"
          "in": "query"
          "description": "Optional assignee UUID."
          "required": false
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "priority"
          "in": "query"
          "description": "Optional priority."
          "required": false
          "schema":
            "type": "string"
            "enum":
              - "LOW"
              - "NORMAL"
              - "HIGH"
              - "URGENT"
        -
          "name": "overdue"
          "in": "query"
          "description": "true: only unfinished work orders past their due time."
          "required": false
          "schema":
            "type": "boolean"
            "default": false
        -
          "name": "from"
          "in": "query"
          "description": "Optional start of createdAt, inclusive, ISO-8601."
          "required": false
          "schema":
            "type": "string"
            "format": "date-time"
        -
          "name": "to"
          "in": "query"
          "description": "Optional end of createdAt, exclusive, ISO-8601; after from."
          "required": false
          "schema":
            "type": "string"
            "format": "date-time"
        -
          "name": "maintenancePlanId"
          "in": "query"
          "description": "Issue #70: optional maintenance plan UUID (SCHEDULE work orders of that plan)."
          "required": false
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "page"
          "in": "query"
          "description": "Zero-based page index."
          "required": false
          "schema":
            "type": "integer"
            "format": "int32"
            "default": 0
        -
          "name": "size"
          "in": "query"
          "description": "Page size, 1 to 100."
          "required": false
          "schema":
            "type": "integer"
            "format": "int32"
            "default": 20
      "responses":
        "400":
          "description": "Malformed UUID, invalid filter, paging or body"
