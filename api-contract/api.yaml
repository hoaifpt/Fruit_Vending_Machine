  "/api/v1/kiosk/orders":
    "post":
      "tags":
        - "Kiosk Orders"
      "summary": "Create a one-bowl order and reserve the next bowl to dispense"
      "description": "KIOSK only. One purchase = one bowl. In one transaction: locks the product and the machine (shared) and the slots of this machine holding the product (FOR UPDATE, id order), then reserves the head of a sellable slot: the bottom bowl of the column (earliest loadedAt, tie-break id) that must be AVAILABLE, of the requested ACTIVE product, in an ACTIVE slot, with a batch outliving the hold deadline. Bowls behind a head are never reserved, so a slot has at most one RESERVED bowl; a RESERVED, EXPIRED, DISPENSE_FAILED or soon-expiring head blocks its slot. Between sellable slots the head expiring first wins (then head loadedAt, slotCode, slot id). Creates a PENDING_PAYMENT order with exactly one item of quantity 1 at the server-side price, expiresAt = now + reservation TTL, one allocation and RESERVE history. Machine, prices, quantity and status are never accepted from the client."
      "operationId": "createKioskOrder"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CreateOrderRequest"
            "example":
              "productId": "1c2d3e4f-0000-4000-8000-000000000001"
        "required": true
      "responses":
        "201":
          "description": "Order created with one item (quantity 1) and its bowl reserved"
          "headers":
            "Cache-Control":
              "schema":
                "type": "string"
                "const": "no-store"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiResponseKioskOrderResponse"
              "example":
                "message": "Success"
                "data":
                  "id": "e0f1a2b3-0000-4000-8000-000000000001"
                  "orderCode": "ORD-20261015-7K3QF9XA"
                  "machineId": "9b1e0000-0000-4000-8000-000000000001"
                  "status": "PENDING_PAYMENT"
                  "items":
                    -
                      "unitPrice": 35000.0
                      "productId": "1c2d3e4f-0000-4000-8000-000000000001"
                      "productName": "Mixed Fruit Bowl"
                      "totalPrice": 35000.0
                      "sku": "BOWL-MIX"
                      "quantity": 1
                  "subtotal": 35000.0
                  "totalAmount": 35000.0
                  "createdAt": "2026-10-15T04:00:00Z"
                  "expiresAt": "2026-10-15T04:05:00Z"
                  "cancelledAt": null
                  "currentPayment": null
                "timestamp": "2026-10-15T04:00:00Z"
        "400":
          "description": "Validation failure: missing or malformed productId, or any other field (items, quantity, price, machineId, status, ...)"
