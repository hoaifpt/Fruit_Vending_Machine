openapi: 3.1.0
info:
  title: Fruit Machine Backend API
  version: v1
  description: Management API. Login is public; other application endpoints require Bearer authentication. ADMIN/STAFF roles are independent. User Management requires ADMIN and creates STAFF accounts. No refresh tokens.
servers:
  - url: http://localhost:8080
tags:
  - name: "Alerts"
    description: "Machine and slot problems found by the 60 s health check, dispense failures and machine faults. One unresolved alert per problem; the system resolves state-based alerts when the condition clears. ALERT_READ lists, ALERT_MANAGE acknowledges and resolves (ADMIN and STAFF). Alerts are never created or deleted through the API."
  - name: "Audit Log"
    description: "Read-only audit log (who changed what, and when) for AUDIT_LOG_READ, held by ADMIN. Entries are written by the services that make the changes; there is no create, update or delete endpoint."
  - name: Auth
    description: Management authentication. Login remains public; ADMIN/STAFF roles are independent.
  - name: Inventory
    description: Management of individual physical boxes. ACTIVE ADMIN/STAFF read/load/remove confirmed stock. No order/payment/reservation/dispense workflows.
  - name: Kiosk
    description: "Kiosk-facing APIs authenticated with the machine-bound X-Kiosk-Key header (not a user JWT). The machine is always derived from the credential."
  - name: Kiosk Credentials
    description: "ADMIN-only management of machine-bound kiosk API keys. The plaintext key is shown once, only its SHA-256 digest is stored. STAFF cannot read credential metadata."
  - name: Kiosk Orders
    description: "Kiosk order creation with atomic reservation of exactly one bowl, own-order read and cancel. Only PENDING_PAYMENT and CANCELLED are produced; payment attempts are in Kiosk Payments and there is no dispensing. Changelog (issue #35, breaking): the create request is now {\"productId\"} only; the former items[]/quantity shape is rejected with 400."
  - name: Kiosk Payments
    description: "Kiosk payment attempts (QR) for its own PENDING_PAYMENT orders. This API never reports payment success; only a verified provider webhook (a later issue) can do that."
  - name: "Machine Events"
    description: "History of each machine for ADMIN/STAFF with MACHINE_READ: every valid MQTT event and status message it sent (source MACHINE, once per messageId) and the backend decisions about it (source BACKEND). Read-only evidence; heartbeats and telemetry are not part of it."
  - name: "Machine Health"
    description: "Temperature/humidity readings sent by the machines over MQTT (telemetry channel), for ADMIN/STAFF with MACHINE_READ. Machine connectivity and controller diagnostics are part of the Machines responses. Display only: no alerts."
  - name: Machine Slots
    description: Machine-scoped slot configuration. ACTIVE ADMIN/STAFF can read; ADMIN only can write. No stock or hardware API.
  - name: Machines
    description: Machine management. ACTIVE ADMIN/STAFF can read; ADMIN only can write. No public kiosk API.
  - name: "Maintenance Commands"
    description: "Remote column maintenance while a machine is in MAINTENANCE: remove the head bowl, empty a column, open or close the refill gate (Staff/Admin), and RESET of a controller fault (Admin). One unfinished command per machine; dispense and maintenance never overlap. Inventory changes only when the machine reports COMPLETED, or when Staff reconciles an uncertain command as DONE. 409 messages start with a code: MACHINE_NOT_IN_MAINTENANCE, MACHINE_COMMAND_IN_PROGRESS, MACHINE_OFFLINE, SLOT_HAS_RESERVED_ITEM, SLOT_EMPTY, NOT_HEAD_ITEM, HEAD_NOT_REMOVABLE, REFILL_GATE_OPEN, IDEMPOTENCY_KEY_REUSED, NOT_RECONCILABLE, EFFECT_NOT_POSSIBLE."
  - name: "Maintenance Plans"
    description: "Recurring maintenance per machine: every intervalDays the system creates one MAINTENANCE work order (source SCHEDULE) leadDays before the due date, due at dueTime (Asia/Ho_Chi_Minh), assigned to the default assignee or announced to managers. Completing it moves the next due date to completion date + interval; cancelling skips the occurrence. MAINTENANCE_PLAN_READ (ADMIN, STAFF) reads, MAINTENANCE_PLAN_MANAGE (ADMIN) changes; every change is audited. Plans are deactivated, never deleted."
  - name: "Notifications"
    description: "Portal notifications of the signed-in user: one per new alert for users holding ALERT_NOTIFY (ADMIN by default). Any signed-in user, own notifications only; no extra permission. Poll unread-count every 30 s."
  - name: Orders
    description: "Read-only order management for ADMIN and STAFF. There is no write, delete or status endpoint; order status is produced only by backend workflows."
  - name: Payment Webhook Logs
    description: "Read-only evidence of every provider webhook attempt for ADMIN. No replay, no delete, and the signature is never returned."
  - name: Payment Webhooks
    description: "Provider-to-server payment notifications. Public endpoint authenticated only by the provider signature; no JWT and no kiosk key. This is the only path that can produce payment SUCCESS and order PAID."
  - name: Payments
    description: "Read-only payment management for ADMIN. There is no write, delete or status endpoint; no client can mark a payment successful."
  - name: "Pricing"
    description: "Near-expiry discount managed by Admin: a bowl whose batch expires on the current business day (Asia/Ho_Chi_Minh) is sold at the configured percent, rounded down to whole VND. The price is locked when the order reserves its bowl; changes affect new orders only. PRICING_READ (ADMIN, STAFF) views, PRICING_MANAGE (ADMIN) changes."
  - name: Product Batches
    description: Management batch traceability. ACTIVE ADMIN and STAFF can create/read. Immutable after creation; no inventory workflows.
  - name: Products
    description: Management catalog. ACTIVE ADMIN/STAFF can read; ADMIN only can write. No public kiosk API.
  - name: "Restock"
    description: "Restock workflow on RESTOCK work orders: Admin (RESTOCK_PLAN) gets per-slot suggestions and plans lines; the assignee (RESTOCK_EXECUTE) loads bowls against a line of the IN_PROGRESS work order (history references the line); completion compares planned and loaded. Direct POST /api/v1/inventory/load is ADMIN only. 409 messages start with a code: RESTOCK_WITHOUT_LINES, LINE_ALREADY_LOADED, DUPLICATE_LINE, SLOT_INACTIVE, PRODUCT_INACTIVE, NOTHING_TO_RESTOCK, WORK_ORDER_NOT_IN_PROGRESS, BATCH_PRODUCT_MISMATCH, BATCH_EXPIRED, EXPIRY_INVERSION, SLOT_CAPACITY_EXCEEDED, BATCH_QUANTITY_EXCEEDED, RESTOCK_VARIANCE_REASON_REQUIRED, REFILL_GATE_OPEN."
  - name: Roles & Permissions
    description: "Roles are sets of permissions; every protected endpoint checks a permission. An account with PERMISSION_MANAGE views roles and the catalog and replaces a role's permission set; changes apply on each member's next request. Roles and permissions cannot be created, renamed or deleted here."
  - name: Users
    description: Management accounts. Every operation requires an ACTIVE ADMIN; STAFF receives 403.
  - name: "Work Orders"
    description: "Jobs Staff do at a machine: RESTOCK, MAINTENANCE, INCIDENT. Admin (WORK_ORDER_MANAGE) creates, edits, assigns, cancels; the assignee (WORK_ORDER_EXECUTE) starts and completes; Admin may act for them. OPEN -> ASSIGNED -> IN_PROGRESS -> DONE, CANCELLED before DONE. Starting RESTOCK / MAINTENANCE (INCIDENT on request) puts the machine in MAINTENANCE; only an Admin reactivates it, and not while a work order is IN_PROGRESS. Without WORK_ORDER_READ_ALL, work orders assigned to others are 404. 409 messages start with a code: INVALID_WORK_ORDER_TRANSITION, STALE_VERSION, MACHINE_INACTIVE, MACHINE_HAS_ACTIVE_ORDERS, MACHINE_COMMAND_IN_PROGRESS, ALERT_ALREADY_HANDLED, ALERT_RESOLVED."
paths:
  "/api/v1/inventory/transactions":
    "get":
      "x-required-permission": "INVENTORY_READ"
      "tags":
        - "Inventory"
      "summary": "List append-only per-item inventory history"
      "description": "ADMIN or STAFF. DB pagination page0/size20/max100, createdAt,desc with UUID tie-break; optional exact filters. N loaded boxes produce N LOAD rows sharing referenceId. Snapshot location/actor/status/reason returned, nullable for legacy rows; each row represents one box. No history mutation endpoints."
      "operationId": "listInventoryTransactions"
      "parameters":
        -
          "name": "page"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "format": "int32"
            "default": 0
            "minimum": 0
        -
          "name": "size"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "format": "int32"
            "default": 20
            "maximum": 100
            "minimum": 1
        -
          "name": "inventoryItemId"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "machineId"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "slotId"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "referenceId"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "type"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "enum":
              - "LOAD"
              - "RESERVE"
              - "SALE"
              - "EXPIRE"
              - "REMOVE"
              - "RETURN"
              - "ADJUSTMENT"
      "responses":
        "400":
          "description": "Invalid parameters, malformed/unknown JSON or validation failure"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "message": "Request body is missing or malformed"
                "timestamp": "2026-10-10T02:00:00Z"
                "error": "Bad Request"
                "path": "/api/v1/inventory/transactions"
                "status": 400
        "401":
          "description": "Missing/invalid/expired Bearer token or unavailable account"
          "headers":
            "WWW-Authenticate":
              "schema":
                "type": "string"
                "const": "Bearer"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "message": "Authentication required or access token invalid"
                "timestamp": "2026-10-10T02:00:00Z"
                "error": "Unauthorized"
                "path": "/api/v1/inventory/transactions"
                "status": 401
        "403":
          "description": "Authenticated account lacks ADMIN/STAFF role"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "message": "Access denied"
                "timestamp": "2026-10-10T02:00:00Z"
                "error": "Forbidden"
                "path": "/api/v1/inventory/transactions"
                "status": 403
        "404":
          "description": "Requested item, batch, machine or scoped slot not found"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "message": "Inventory item not found"
                "timestamp": "2026-10-10T02:00:00Z"
                "error": "Not Found"
                "path": "/api/v1/inventory/transactions"
                "status": 404
        "500":
          "description": "Unexpected server error; no internal details"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "message": "An unexpected error occurred"
                "timestamp": "2026-10-10T02:00:00Z"
                "error": "Internal Server Error"
                "path": "/api/v1/inventory/transactions"
                "status": 500
        "200":
          "description": "Inventory history page"
          "headers":
            "Cache-Control":
              "schema":
                "type": "string"
                "const": "no-store"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiResponseInventoryTransactionPageResponse"
              "example":
                "data":
                  "page": 0
                  "size": 20
                  "content":
                    -
                      "inventoryItemId": "c6a33ea7-0c1c-4bbf-a890-3b7286d10a06"
                      "id": "c6a33ea7-0c1c-4bbf-a890-3b7286d10a08"
                      "batchCode": "MANGO-20261010-01"
                      "type": "LOAD"
                      "batchId": "c6a33ea7-0c1c-4bbf-a890-3b7286d10a05"
                      "machineId": "c6a33ea7-0c1c-4bbf-a890-3b7286d10a03"
                      "referenceId": "c6a33ea7-0c1c-4bbf-a890-3b7286d10a07"
                      "statusAfter": "AVAILABLE"
                      "performedBy": "c6a33ea7-0c1c-4bbf-a890-3b7286d10a01"
                      "createdAt": "2026-10-10T02:00:00Z"
                      "slotId": "c6a33ea7-0c1c-4bbf-a890-3b7286d10a04"
                  "totalElements": 1
                  "totalPages": 1
                "timestamp": "2026-10-10T02:00:00Z"
                "message": "Inventory transactions retrieved"
      "security":
        -
          "bearerAuth": []
  "/api/v1/inventory/{id}":
    "get":
      "x-required-permission": "INVENTORY_READ"
      "tags":
        - "Inventory"
      "summary": "Get physical item details"
      "description": "ADMIN or STAFF. Safe item/batch/product/location DTO, including historical SOLD/REMOVED and legacy off-machine items. UTC expiry and derived expired flag; no recursive entities or credentials."
      "operationId": "getInventory"
      "parameters":
        -
          "name": "id"
          "in": "path"
          "description": "Inventory item UUID."
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "responses":
        "400":
          "description": "Invalid parameters, malformed/unknown JSON or validation failure"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "message": "Request body is missing or malformed"
                "timestamp": "2026-10-10T02:00:00Z"
                "error": "Bad Request"
                "path": "/api/v1/inventory/{id}"
                "status": 400
        "401":
          "description": "Missing/invalid/expired Bearer token or unavailable account"
          "headers":
            "WWW-Authenticate":
              "schema":
                "type": "string"
                "const": "Bearer"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "message": "Authentication required or access token invalid"
                "timestamp": "2026-10-10T02:00:00Z"
                "error": "Unauthorized"
                "path": "/api/v1/inventory/{id}"
                "status": 401
        "403":
          "description": "Authenticated account lacks ADMIN/STAFF role"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "message": "Access denied"
                "timestamp": "2026-10-10T02:00:00Z"
                "error": "Forbidden"
                "path": "/api/v1/inventory/{id}"
                "status": 403
        "404":
          "description": "Requested item, batch, machine or scoped slot not found"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "message": "Inventory item not found"
                "timestamp": "2026-10-10T02:00:00Z"
                "error": "Not Found"
                "path": "/api/v1/inventory/{id}"
                "status": 404
        "500":
          "description": "Unexpected server error; no internal details"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "message": "An unexpected error occurred"
                "timestamp": "2026-10-10T02:00:00Z"
                "error": "Internal Server Error"
                "path": "/api/v1/inventory/{id}"
                "status": 500
        "200":
          "description": "Inventory item details"
          "headers":
            "Cache-Control":
              "schema":
                "type": "string"
                "const": "no-store"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiResponseInventoryItemResponse"
              "example":
                "data":
                  "expiresAt": "2026-10-12T01:00:00Z"
                  "productName": "Mango Fruit Box"
                  "updatedAt": "2026-10-10T02:00:00Z"
                  "productId": "c6a33ea7-0c1c-4bbf-a890-3b7286d10a02"
                  "id": "c6a33ea7-0c1c-4bbf-a890-3b7286d10a06"
                  "createdAt": "2026-10-10T02:00:00Z"
                  "status": "AVAILABLE"
                  "slotId": "c6a33ea7-0c1c-4bbf-a890-3b7286d10a04"
                  "slotCode": "A"
                  "loadedAt": "2026-10-10T02:00:00Z"
                  "batchId": "c6a33ea7-0c1c-4bbf-a890-3b7286d10a05"
                  "machineId": "c6a33ea7-0c1c-4bbf-a890-3b7286d10a03"
                  "batchCode": "MANGO-20261010-01"
                  "expired": false
                "timestamp": "2026-10-10T02:00:00Z"
                "message": "Inventory item retrieved"
      "security":
        -
          "bearerAuth": []
  "/api/v1/inventory":
    "get":
      "x-required-permission": "INVENTORY_READ"
      "tags":
        - "Inventory"
      "summary": "List/filter physical inventory"
      "description": "ADMIN or STAFF. Combined exact machine/slot/batch/status filters and optional batch-time expired filter (all statuses). Unknown filter IDs produce empty pages. Database pagination page0/size20/max100 with to-one graph, no collection paging. One approved sort id/status/loadedAt/createdAt/updatedAt, default createdAt,desc plus UUID ascending tie-break. Legacy off-machine rows supported."
      "operationId": "listInventory"
      "parameters":
        -
          "name": "page"
          "in": "query"
          "description": "Zero-based page."
          "required": false
          "schema":
            "type": "integer"
            "format": "int32"
            "default": 0
            "minimum": 0
        -
          "name": "size"
          "in": "query"
          "description": "Page size 1..100."
          "required": false
          "schema":
            "type": "integer"
            "format": "int32"
            "default": 20
            "maximum": 100
            "minimum": 1
        -
          "name": "machineId"
          "in": "query"
          "description": "Machine UUID filter."
          "required": false
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "slotId"
          "in": "query"
          "description": "Slot UUID filter."
          "required": false
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "batchId"
          "in": "query"
          "description": "Batch UUID filter."
          "required": false
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "status"
          "in": "query"
          "description": "Exact stored inventory status."
          "required": false
          "schema":
            "type": "string"
            "enum":
              - "AVAILABLE"
              - "RESERVED"
              - "SOLD"
              - "EXPIRED"
              - "REMOVED"
              - "DISPENSE_FAILED"
        -
          "name": "expired"
          "in": "query"
          "description": "Derived batch expiry <= now when true, > now when false; does not change status."
          "required": false
          "schema":
            "type": "boolean"
        -
          "name": "sort"
          "in": "query"
          "description": "One approved field id/status/loadedAt/createdAt/updatedAt, optional asc/desc; asc when omitted."
          "required": false
          "schema":
            "type": "string"
            "default": "createdAt,desc"
      "responses":
        "400":
          "description": "Invalid parameters, malformed/unknown JSON or validation failure"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "message": "Request body is missing or malformed"
                "timestamp": "2026-10-10T02:00:00Z"
                "error": "Bad Request"
                "path": "/api/v1/inventory"
                "status": 400
        "401":
          "description": "Missing/invalid/expired Bearer token or unavailable account"
          "headers":
            "WWW-Authenticate":
              "schema":
                "type": "string"
                "const": "Bearer"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "message": "Authentication required or access token invalid"
                "timestamp": "2026-10-10T02:00:00Z"
                "error": "Unauthorized"
                "path": "/api/v1/inventory"
                "status": 401
        "403":
          "description": "Authenticated account lacks ADMIN/STAFF role"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "message": "Access denied"
                "timestamp": "2026-10-10T02:00:00Z"
                "error": "Forbidden"
                "path": "/api/v1/inventory"
                "status": 403
        "404":
          "description": "Requested item, batch, machine or scoped slot not found"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "message": "Inventory item not found"
                "timestamp": "2026-10-10T02:00:00Z"
                "error": "Not Found"
                "path": "/api/v1/inventory"
                "status": 404
        "500":
          "description": "Unexpected server error; no internal details"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "message": "An unexpected error occurred"
                "timestamp": "2026-10-10T02:00:00Z"
                "error": "Internal Server Error"
                "path": "/api/v1/inventory"
                "status": 500
        "200":
          "description": "Database page of safe item DTOs"
          "headers":
            "Cache-Control":
              "schema":
                "type": "string"
                "const": "no-store"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiResponseInventoryPageResponse"
              "example":
                "data":
                  "page": 0
                  "size": 20
                  "content":
                    -
                      "expiresAt": "2026-10-12T01:00:00Z"
                      "productName": "Mango Fruit Box"
                      "updatedAt": "2026-10-10T02:00:00Z"
                      "productId": "c6a33ea7-0c1c-4bbf-a890-3b7286d10a02"
                      "id": "c6a33ea7-0c1c-4bbf-a890-3b7286d10a06"
                      "createdAt": "2026-10-10T02:00:00Z"
                      "status": "AVAILABLE"
                      "slotId": "c6a33ea7-0c1c-4bbf-a890-3b7286d10a04"
                      "slotCode": "A"
                      "loadedAt": "2026-10-10T02:00:00Z"
                      "batchId": "c6a33ea7-0c1c-4bbf-a890-3b7286d10a05"
                      "machineId": "c6a33ea7-0c1c-4bbf-a890-3b7286d10a03"
                      "batchCode": "MANGO-20261010-01"
                      "expired": false
                  "totalElements": 1
                  "totalPages": 1
                "timestamp": "2026-10-10T02:00:00Z"
                "message": "Inventory retrieved"
      "security":
        -
          "bearerAuth": []
  "/api/v1/machines/{machineId}/inventory":
    "get":
      "x-required-permission": "INVENTORY_READ"
      "tags":
        - "Inventory"
      "summary": "List inventory in a machine"
      "description": "ADMIN or STAFF. Existing machine required. Database page scoped through item slot FK to machine, including retained historical locations. Default createdAt,desc with UUID tie-break."
      "operationId": "listMachineInventory"
      "parameters":
        -
          "name": "machineId"
          "in": "path"
          "description": "Machine UUID."
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "page"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "format": "int32"
            "default": 0
            "minimum": 0
        -
          "name": "size"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "format": "int32"
            "default": 20
            "maximum": 100
            "minimum": 1
        -
          "name": "status"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "enum":
              - "AVAILABLE"
              - "RESERVED"
              - "SOLD"
              - "EXPIRED"
              - "REMOVED"
              - "DISPENSE_FAILED"
        -
          "name": "expired"
          "in": "query"
          "required": false
          "schema":
            "type": "boolean"
      "responses":
        "400":
          "description": "Invalid parameters, malformed/unknown JSON or validation failure"
          "content":
            "application/json":
              "schema":
