          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example: {"timestamp":"2026-10-06T00:00:00Z","status":401,"error":"Unauthorized","message":"Authentication required or access token invalid","path":"/api/v1/users/{id}/status"}
        '403':
          description: Authenticated account lacks ADMIN access
