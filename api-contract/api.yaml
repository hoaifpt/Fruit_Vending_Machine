                  "rawBody": null
                "message": "Success"
                "timestamp": "2026-10-16T04:00:00Z"
        "404":
          "description": "Webhook log not found"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "error": "Not Found"
                "timestamp": "2026-10-16T04:00:00Z"
                "message": "Payment provider not found"
                "status": 404
                "path": "/api/v1/payment-webhook-logs/{id}"
        "400":
          "description": "Invalid parameters"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "error": "Bad Request"
                "timestamp": "2026-10-16T04:00:00Z"
                "message": "Request validation failed"
                "status": 400
                "path": "/api/v1/payment-webhook-logs/{id}"
        "401":
          "description": "Missing/invalid/expired Bearer token (a kiosk key is not accepted here)"
          "headers":
            "WWW-Authenticate":
              "schema":
                "type": "string"
                "const": "Bearer"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "error": "Unauthorized"
                "timestamp": "2026-10-16T04:00:00Z"
                "message": "Authentication required or access token invalid"
                "status": 401
                "path": "/api/v1/payment-webhook-logs/{id}"
        "403":
          "description": "Authenticated account is not ADMIN"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "error": "Forbidden"
                "timestamp": "2026-10-16T04:00:00Z"
                "message": "Access denied"
                "status": 403
                "path": "/api/v1/payment-webhook-logs/{id}"
        "500":
          "description": "Unexpected server error; no internal details"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "error": "Internal Server Error"
                "timestamp": "2026-10-16T04:00:00Z"
                "message": "An unexpected error occurred"
                "status": 500
                "path": "/api/v1/payment-webhook-logs/{id}"
      "security":
        -
          "bearerAuth": []
  "/api/v1/payments":
    "get":
      "tags":
        - "Payments"
      "summary": "List and filter payment attempts"
      "description": "ADMIN only. Database pagination page0/size20/max100. Filters combine: status, provider (normalized to uppercase), orderId, machineId (through the order), createdFrom (inclusive), createdTo (exclusive). Approved sorts createdAt (default desc), amount, paidAt, each with a UUID tie-break. Items never include the QR payload."
      "operationId": "listPayments"
      "parameters":
        -
          "name": "page"
          "in": "query"
          "description": "Zero-based page."
          "required": false
          "schema":
            "type": "integer"
            "format": "int32"
            "default": 0
            "minimum": 0
        -
          "name": "size"
          "in": "query"
          "description": "Page size 1..100."
          "required": false
          "schema":
            "type": "integer"
            "format": "int32"
            "default": 20
            "maximum": 100
            "minimum": 1
        -
          "name": "status"
          "in": "query"
          "description": "Exact stored payment status."
          "required": false
          "schema":
            "type": "string"
            "enum":
              - "PENDING"
              - "SUCCESS"
              - "FAILED"
              - "EXPIRED"
              - "REFUNDED"
        -
          "name": "provider"
          "in": "query"
          "description": "Provider code, case-insensitive, for example MOCK."
          "required": false
          "schema":
            "type": "string"
        -
          "name": "orderId"
          "in": "query"
          "description": "Order UUID filter."
          "required": false
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "machineId"
          "in": "query"
          "description": "Machine UUID filter, resolved through the order."
          "required": false
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "createdFrom"
          "in": "query"
          "description": "ISO-8601 instant, inclusive lower bound of createdAt."
          "required": false
          "schema":
            "type": "string"
            "format": "date-time"
        -
          "name": "createdTo"
          "in": "query"
          "description": "ISO-8601 instant, exclusive upper bound of createdAt."
          "required": false
          "schema":
            "type": "string"
            "format": "date-time"
        -
          "name": "requiresAttention"
          "in": "query"
          "description": "true returns SUCCESS payments that need human review: the order was CANCELLED (late payment) or another SUCCESS payment exists for the same order (duplicate payment, both are listed and the later one is the refund candidate). Amount mismatches leave the payment unchanged, so they are found through the webhook logs and audit_logs."
          "required": false
          "schema":
            "type": "boolean"
        -
          "name": "sort"
          "in": "query"
          "description": "One of createdAt, amount, paidAt with optional asc/desc."
          "required": false
          "schema":
            "type": "string"
            "default": "createdAt,desc"
      "responses":
        "400":
          "description": "Invalid parameters"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "error": "Bad Request"
                "timestamp": "2026-10-15T04:00:00Z"
                "message": "Request validation failed"
                "status": 400
                "path": "/api/v1/payments"
        "401":
          "description": "Missing/invalid/expired Bearer token (a kiosk key is not accepted here)"
          "headers":
            "WWW-Authenticate":
              "schema":
                "type": "string"
                "const": "Bearer"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "error": "Unauthorized"
                "timestamp": "2026-10-15T04:00:00Z"
                "message": "Authentication required or access token invalid"
                "status": 401
                "path": "/api/v1/payments"
        "403":
          "description": "Authenticated account is not ADMIN"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "error": "Forbidden"
                "timestamp": "2026-10-15T04:00:00Z"
                "message": "Access denied"
                "status": 403
                "path": "/api/v1/payments"
        "500":
          "description": "Unexpected server error; no internal details"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "error": "Internal Server Error"
                "timestamp": "2026-10-15T04:00:00Z"
                "message": "An unexpected error occurred"
                "status": 500
                "path": "/api/v1/payments"
        "200":
          "description": "Database page of payment summaries"
          "headers":
            "Cache-Control":
              "schema":
                "type": "string"
                "const": "no-store"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiResponsePaymentPageResponse"
              "example":
                "data":
                  "size": 20
                  "page": 0
                  "totalPages": 1
                  "totalElements": 1
                  "content":
                    -
                      "id": "5d6e0000-0000-4000-8000-000000000001"
                      "orderId": "e0f1a2b3-0000-4000-8000-000000000001"
                      "orderCode": "ORD-20261015-7K3QF9XA"
                      "machineCode": "FV-HCM-001"
                      "provider": "MOCK"
                      "status": "PENDING"
                      "amount": 70000.0
                      "paymentReference": "MOCK-8F3KQ2AB"
                      "transactionId": null
                      "createdAt": "2026-10-15T04:00:05Z"
                      "paidAt": null
                      "expiredAt": "2026-10-15T04:05:00Z"
                "message": "Success"
                "timestamp": "2026-10-15T04:00:00Z"
      "security":
        -
          "bearerAuth": []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Paste the access token only (without the Bearer prefix).
    kioskKey:
      "type": "apiKey"
      "description": "Machine-bound kiosk key (fvk_<prefix>_<secret>) issued by an ADMIN. Not a user JWT."
      "name": "X-Kiosk-Key"
      "in": "header"
  schemas:
    "InventoryTransactionResponse":
      "type": "object"
      "description": "Append-only per-item history. Location snapshots, actor UUID, grouping reference, reason/status snapshots; legacy fields may be null. Each row represents one box; no aggregate quantity column."
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "inventoryItemId":
          "type": "string"
          "format": "uuid"
        "batchId":
          "type": "string"
          "format": "uuid"
        "batchCode":
          "type": "string"
        "machineId":
          "type": "string"
          "format": "uuid"
        "slotId":
          "type": "string"
          "format": "uuid"
        "type":
          "type": "string"
          "enum":
            - "LOAD"
            - "RESERVE"
            - "SALE"
            - "EXPIRE"
            - "REMOVE"
            - "RETURN"
            - "ADJUSTMENT"
        "referenceId":
          "type": "string"
          "format": "uuid"
        "performedBy":
          "type": "string"
          "format": "uuid"
        "reason":
          "type": "string"
        "statusBefore":
          "type": "string"
          "enum":
            - "AVAILABLE"
            - "RESERVED"
            - "SOLD"
            - "EXPIRED"
            - "REMOVED"
            - "DISPENSE_FAILED"
        "statusAfter":
          "type": "string"
          "enum":
            - "AVAILABLE"
            - "RESERVED"
            - "SOLD"
            - "EXPIRED"
            - "REMOVED"
            - "DISPENSE_FAILED"
        "createdAt":
          "type": "string"
          "format": "date-time"
    "InventoryTransactionPageResponse":
      "type": "object"
      "properties":
        "content":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/InventoryTransactionResponse"
        "page":
          "type": "integer"
          "format": "int32"
        "size":
          "type": "integer"
          "format": "int32"
        "totalElements":
          "type": "integer"
          "format": "int64"
        "totalPages":
          "type": "integer"
          "format": "int32"
    "ApiResponseInventoryTransactionPageResponse":
      "type": "object"
      "properties":
        "timestamp":
          "type": "string"
          "format": "date-time"
        "message":
          "type": "string"
        "data":
          "$ref": "#/components/schemas/InventoryTransactionPageResponse"
    "InventorySummaryResponse":
      "type": "object"
      "description": "DB counts at asOf: occupied AVAILABLE/RESERVED/EXPIRED/DISPENSE_FAILED; available AVAILABLE+unexpired; sellable additionally ACTIVE product/machine/slot; expiredCount counts physically present expired boxes. Remaining capacity clamped at zero for legacy overcapacity."
      "properties":
        "machineId":
          "type": "string"
          "format": "uuid"
        "slotId":
          "type": "string"
          "format": "uuid"
        "capacity":
          "type": "integer"
          "format": "int32"
        "occupiedCount":
          "type": "integer"
          "format": "int64"
        "availableCount":
          "type": "integer"
          "format": "int64"
        "expiredCount":
          "type": "integer"
          "format": "int64"
        "reservedCount":
          "type": "integer"
          "format": "int64"
        "sellableCount":
          "type": "integer"
          "format": "int64"
        "remainingCapacity":
          "type": "integer"
          "format": "int64"
        "asOf":
          "type": "string"
          "format": "date-time"
        "headStatus":
          "type":
            - "string"
            - "null"
          "description": "Status of the slot head, the physically present bowl dispensed next (earliest loadedAt, tie-break id); null when the slot is empty. Only an AVAILABLE, unexpired head can be sold; any other head blocks the whole column."
          "enum":
            - "AVAILABLE"
            - "RESERVED"
            - "EXPIRED"
            - "DISPENSE_FAILED"
        "headExpired":
          "type": "boolean"
          "description": "true when the head has status EXPIRED or its batch is expired at asOf; staff must remove it before the column can sell again. false when empty."
    "ApiResponseInventorySummaryResponse":
      "type": "object"
      "properties":
        "timestamp":
          "type": "string"
          "format": "date-time"
        "message":
          "type": "string"
        "data":
          "$ref": "#/components/schemas/InventorySummaryResponse"
    "InventoryPageResponse":
      "type": "object"
      "properties":
        "content":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/InventoryItemResponse"
        "page":
          "type": "integer"
          "format": "int32"
        "size":
          "type": "integer"
          "format": "int32"
        "totalElements":
          "type": "integer"
          "format": "int64"
        "totalPages":
          "type": "integer"
          "format": "int32"
    "ApiResponseInventoryPageResponse":
      "type": "object"
      "properties":
        "timestamp":
          "type": "string"
          "format": "date-time"
        "message":
          "type": "string"
        "data":
          "$ref": "#/components/schemas/InventoryPageResponse"
    "InventoryLoadResponse":
      "type": "object"
      "description": "One server-generated operationId shared as reference_id by the N per-item LOAD history rows; not an idempotency key."
      "properties":
        "operationId":
          "type": "string"
          "format": "uuid"
        "quantity":
          "type": "integer"
          "format": "int32"
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/InventoryItemResponse"
    "ApiResponseInventoryLoadResponse":
      "type": "object"
      "properties":
        "timestamp":
          "type": "string"
          "format": "date-time"
        "message":
          "type": "string"
        "data":
          "$ref": "#/components/schemas/InventoryLoadResponse"
    "LoadInventoryRequest":
      "type": "object"
      "additionalProperties": false
      "description": "Registers physically loaded and confirmed boxes. No hardware action. Creator comes from JWT; unknown fields rejected."
      "properties":
        "batchId":
          "type": "string"
          "format": "uuid"
        "slotId":
          "type": "string"
          "format": "uuid"
        "quantity":
          "type": "integer"
          "format": "int32"
          "description": "JSON integer token, 1..1000 per request; bounded bulk operation, independent of hardware capacity."
          "example": 4
          "exclusiveMinimum": 0
          "maximum": 1000
          "minimum": 1
      "required":
        - "batchId"
        - "quantity"
        - "slotId"
    "InventoryItemResponse":
      "type": "object"
      "description": "One physical box; nullable location for legacy off-machine rows. Expired is derived from batch expiry at request time, independent of stored status."
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "batchId":
          "type": "string"
          "format": "uuid"
        "batchCode":
          "type": "string"
        "productId":
          "type": "string"
          "format": "uuid"
        "productName":
          "type": "string"
        "machineId":
          "type": "string"
          "format": "uuid"
        "slotId":
          "type": "string"
          "format": "uuid"
        "slotCode":
          "type": "string"
        "status":
          "type": "string"
          "enum":
            - "AVAILABLE"
            - "RESERVED"
            - "SOLD"
            - "EXPIRED"
            - "REMOVED"
            - "DISPENSE_FAILED"
        "expiresAt":
          "type": "string"
          "format": "date-time"
        "expired":
          "type": "boolean"
        "loadedAt":
          "type": "string"
          "format": "date-time"
        "removedAt":
          "type": "string"
          "format": "date-time"
        "createdAt":
          "type": "string"
          "format": "date-time"
        "updatedAt":
          "type": "string"
          "format": "date-time"
    "ApiResponseInventoryItemResponse":
      "type": "object"
      "properties":
        "timestamp":
          "type": "string"
          "format": "date-time"
        "message":
          "type": "string"
        "data":
          "$ref": "#/components/schemas/InventoryItemResponse"
    "RemoveInventoryRequest":
      "type": "object"
      "additionalProperties": false
      "description": "Confirms physical removal; reason is stored on append-only per-item history. Actor is server-controlled."
      "properties":
        "reason":
          "type": "string"
          "description": "Nonblank reason, stripped, maximum 500 characters."
          "example": "Expired fruit removed during maintenance"
          "maxLength": 500
          "minLength": 1
      "required":
        - "reason"
    "ApiResponseProductBatchPageResponse":
      "type": "object"
      "properties":
        "timestamp":
          "type": "string"
          "format": "date-time"
        "message":
          "type": "string"
        "data":
          "$ref": "#/components/schemas/ProductBatchPageResponse"
    "ApiResponseProductBatchResponse":
      "type": "object"
      "properties":
        "timestamp":
          "type": "string"
          "format": "date-time"
        "message":
          "type": "string"
        "data":
          "$ref": "#/components/schemas/ProductBatchResponse"
    "ProductBatchPageResponse":
      "type": "object"
      "description": "Database page of batch DTOs; out-of-range pages have empty content."
      "properties":
        "content":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/ProductBatchResponse"
        "page":
          "type": "integer"
          "format": "int32"
        "size":
          "type": "integer"
          "format": "int32"
        "totalElements":
          "type": "integer"
          "format": "int64"
        "totalPages":
          "type": "integer"
          "format": "int32"
    "ProductBatchResponse":
      "type": "object"
      "description": "Immutable batch traceability; product SKU/name are current catalog values. UTC timestamps; no entity collections or stock counters."
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "batchCode":
          "type": "string"
        "productId":
          "type": "string"
          "format": "uuid"
        "productSku":
          "type": "string"
        "productName":
          "type": "string"
        "manufacturedAt":
          "type": "string"
          "format": "date-time"
        "expiresAt":
          "type": "string"
          "format": "date-time"
        "quantity":
          "type": "integer"
          "format": "int32"
          "description": "Original declared quantity, never current available stock."
        "createdBy":
          "type":
            - "string"
            - "null"
          "format": "uuid"
          "description": "Creator UUID, set from authenticated user for new batches; null for legacy rows without a creator."
        "createdAt":
          "type": "string"
          "format": "date-time"
    "CreateProductBatchRequest":
      "type": "object"
      "additionalProperties": false
      "description": "Create immutable traceability batch. Creator and creation time are server-controlled; no inventory is created."
      "properties":
        "batchCode":
          "type": "string"
          "description": "Globally unique, immutable code, stripped and uppercased with Locale.ROOT."
          "example": "MANGO-20261010-01"
          "maxLength": 64
          "minLength": 1
        "productId":
          "type": "string"
          "format": "uuid"
          "description": "Existing ACTIVE product UUID."
        "manufacturedAt":
          "type": "string"
          "format": "date-time"
          "description": "Preparation time, ISO-8601 string with Z or explicit offset; normalized to UTC, truncated to database microseconds."
          "example": "2026-10-10T01:00:00Z"
        "expiresAt":
          "type": "string"
          "format": "date-time"
          "description": "Expiration instant, strictly after preparation and current server time. Same offset/precision rules as manufacturedAt."
          "example": "2026-10-12T01:00:00Z"
        "quantity":
          "type": "integer"
          "format": "int32"
          "description": "Original declared units, not current stock. JSON integer token only, 1 through 2147483647."
          "example": 20
          "exclusiveMinimum": 0
          "maximum": 2147483647
          "minimum": 1
      "required":
        - "batchCode"
        - "expiresAt"
        - "manufacturedAt"
        - "productId"
        - "quantity"
    "UpdateMachineSlotRequest":
      "type": "object"
      "additionalProperties": false
      "description": "Replace capacity only. Identity, parent, slot code, status and timestamps are rejected."
      "properties":
        "capacity":
          "type": "integer"
          "format": "int32"
          "description": "Maximum physical capacity, not current stock. Positive 32-bit integer. Inventory occupancy checks are deferred to Inventory Management."
          "example": 8
          "exclusiveMinimum": 0
          "maximum": 2147483647
          "minimum": 1
      "required":
        - "capacity"
    "ApiResponseMachineSlotResponse":
      "type": "object"
      "properties":
        "timestamp":
          "type": "string"
          "format": "date-time"
        "message":
          "type": "string"
        "data":
          "$ref": "#/components/schemas/MachineSlotResponse"
    "MachineSlotResponse":
      "type": "object"
      "description": "Slot identity, parent UUID, capacity and status only; no nested entities or current stock."
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
          "description": "Slot UUID."
        "machineId":
          "type": "string"
          "format": "uuid"
          "description": "Immutable owning machine UUID."
        "slotCode":
          "type": "string"
          "description": "Immutable code unique within the machine."
          "example": "A1"
        "capacity":
          "type": "integer"
          "format": "int32"
          "description": "Maximum physical capacity, not inventory quantity."
          "maximum": 2147483647
          "minimum": 1
        "status":
          "type": "string"
          "description": "Administrative slot status; independent of machine status."
          "enum":
            - "ACTIVE"
            - "INACTIVE"
            - "ERROR"
        "createdAt":
          "type": "string"
          "format": "date-time"
          "description": "Creation instant, UTC."
        "updatedAt":
          "type": "string"
          "format": "date-time"
          "description": "Modification instant, UTC."
      "required":
        - "capacity"
        - "createdAt"
        - "id"
        - "machineId"
        - "slotCode"
        - "status"
        - "updatedAt"
    "CreateMachineSlotRequest":
      "type": "object"
      "additionalProperties": false
      "description": "Configure a slot on an existing machine; initial status ACTIVE."
      "properties":
        "slotCode":
          "type": "string"
          "description": "Stable code within the parent machine; stripped and uppercased using Locale.ROOT. No hardware naming restriction."
          "example": "A1"
          "maxLength": 32
          "minLength": 1
        "capacity":
          "type": "integer"
          "format": "int32"
          "description": "Maximum physical capacity, not current stock. Positive 32-bit integer."
          "example": 6
          "exclusiveMinimum": 0
          "maximum": 2147483647
          "minimum": 1
      "required":
        - "capacity"
        - "slotCode"
    "UpdateMachineSlotStatusRequest":
      "type": "object"
      "additionalProperties": false
      "description": "Set slot status without changing parent machine status or deleting histories."
      "properties":
        "status":
          "type": "string"
          "description": "ACTIVE, INACTIVE or ERROR. ADMIN sets ERROR manually; no automatic hardware detection."
          "enum":
            - "ACTIVE"
            - "INACTIVE"
            - "ERROR"
          "example": "INACTIVE"
      "required":
        - "status"
    "ApiResponseMachineSlotPageResponse":
      "type": "object"
      "properties":
        "timestamp":
          "type": "string"
          "format": "date-time"
        "message":
          "type": "string"
        "data":
          "$ref": "#/components/schemas/MachineSlotPageResponse"
    "MachineSlotPageResponse":
      "type": "object"
      "description": "Database-paginated slots belonging to one machine, optionally filtered by status."
      "properties":
        "content":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/MachineSlotResponse"
        "page":
          "type": "integer"
          "format": "int32"
