  "/api/v1/webhooks/payments/{provider}":
    "post":
      "tags":
        - "Payment Webhooks"
      "summary": "Receive a payment provider webhook"
      "description": "Public; trusted only after the provider signature is verified (payOS: the signature field of the body; MOCK, development only: X-Mock-Signature = hex HMAC-SHA256 of the exact raw body). The path provider must be the active provider (payos or mock, case-insensitive). The body must be JSON and at most 64 KB. Every attempt that reaches verification is stored in payment_webhook_logs. A verified event is processed idempotently under the Order then Payment locks: SUCCESS makes the payment SUCCESS and a PENDING_PAYMENT order PAID. Late, duplicate, amount-mismatched and conflicting payments are recorded for ADMIN review and never auto-resolved. Response policy: 200 for verified requests (processed, duplicate, unknown reference or anomaly, since retries cannot fix them); 401 when verification fails or the body is malformed; 404 unknown provider; 413 body too large; 415 not JSON; 500 on unexpected errors so the provider retries."
      "operationId": "receivePaymentWebhook"
      "parameters":
        -
          "name": "provider"
          "in": "path"
          "description": "Provider code, case-insensitive."
          "required": true
          "schema":
            "type": "string"
          "example": "payos"
      "requestBody":
        "description": "Provider JSON payload exactly as sent; documentation examples use fake values and signatures shown as hex placeholders."
        "content":
          "application/json":
            "schema":
              "type": "object"
              "additionalProperties": true
            "example":
              "code": "00"
              "desc": "success"
              "success": true
              "data":
                "orderCode": 261016040005123
                "amount": 105000
                "description": "FV7K3QF9X"
                "accountNumber": "0000000000"
                "reference": "FT00000000000"
                "transactionDateTime": "2026-10-16 11:02:13"
                "currency": "VND"
                "paymentLinkId": "fake-link-id"
                "code": "00"
                "desc": "success"
                "counterAccountBankId": ""
                "counterAccountBankName": ""
                "counterAccountName": ""
                "counterAccountNumber": ""
                "virtualAccountName": ""
                "virtualAccountNumber": ""
              "signature": "<hex-hmac-sha256-of-data>"
      "responses":
        "200":
          "description": "Verified webhook acknowledged (minimal provider specific body)"
          "headers":
            "Cache-Control":
              "schema":
                "type": "string"
                "const": "no-store"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "additionalProperties": true
              "example":
                "success": true
        "401":
          "description": "Signature missing or invalid, or the body is malformed"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "error": "Unauthorized"
                "timestamp": "2026-10-16T04:00:00Z"
                "message": "Webhook could not be verified"
                "status": 401
                "path": "/api/v1/webhooks/payments/{provider}"
        "404":
          "description": "Provider is not the active payment provider"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "error": "Not Found"
                "timestamp": "2026-10-16T04:00:00Z"
                "message": "Payment provider not found"
                "status": 404
                "path": "/api/v1/webhooks/payments/{provider}"
        "413":
          "description": "Body larger than 64 KB"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "error": "Payload Too Large"
                "timestamp": "2026-10-16T04:00:00Z"
                "message": "Webhook body is too large"
                "status": 413
                "path": "/api/v1/webhooks/payments/{provider}"
        "415":
          "description": "Content type is not application/json"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "error": "Unsupported Media Type"
                "timestamp": "2026-10-16T04:00:00Z"
                "message": "Unsupported Media Type"
                "status": 415
                "path": "/api/v1/webhooks/payments/{provider}"
        "500":
          "description": "Unexpected error; the provider should retry"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "error": "Internal Server Error"
                "timestamp": "2026-10-16T04:00:00Z"
                "message": "An unexpected error occurred"
                "status": 500
                "path": "/api/v1/webhooks/payments/{provider}"
      "security": []
  "/api/v1/payment-webhook-logs":
    "get":
      "tags":
        - "Payment Webhook Logs"
      "summary": "List webhook attempts"
      "description": "ADMIN only. Database pagination page0/size20/max100. Filters combine: provider (case-insensitive), verified, reference (exact match on the untrusted provider reference hint), receivedFrom (inclusive), receivedTo (exclusive). Sort receivedAt (default desc) or provider, each with a UUID tie-break. Items never include the body or signature."
      "operationId": "listPaymentWebhookLogs"
      "parameters":
        -
          "name": "page"
          "in": "query"
          "description": "Zero-based page."
          "required": false
          "schema":
            "type": "integer"
            "format": "int32"
            "default": 0
            "minimum": 0
        -
          "name": "size"
          "in": "query"
          "description": "Page size 1..100."
          "required": false
          "schema":
            "type": "integer"
            "format": "int32"
            "default": 20
            "maximum": 100
            "minimum": 1
        -
          "name": "provider"
          "in": "query"
          "description": "Provider code, case-insensitive, for example PAYOS."
          "required": false
          "schema":
            "type": "string"
        -
          "name": "verified"
          "in": "query"
          "description": "true for verified attempts only, false for rejected ones."
          "required": false
          "schema":
            "type": "boolean"
        -
          "name": "reference"
          "in": "query"
          "description": "Exact provider reference hint (for payOS the orderCode)."
          "required": false
          "schema":
            "type": "string"
        -
          "name": "receivedFrom"
          "in": "query"
          "description": "ISO-8601 instant, inclusive lower bound of receivedAt."
          "required": false
          "schema":
            "type": "string"
            "format": "date-time"
        -
          "name": "receivedTo"
          "in": "query"
          "description": "ISO-8601 instant, exclusive upper bound of receivedAt."
          "required": false
          "schema":
            "type": "string"
            "format": "date-time"
        -
          "name": "sort"
          "in": "query"
          "description": "receivedAt or provider with optional asc/desc."
          "required": false
          "schema":
            "type": "string"
            "default": "receivedAt,desc"
      "responses":
        "400":
          "description": "Invalid parameters"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "error": "Bad Request"
                "timestamp": "2026-10-16T04:00:00Z"
