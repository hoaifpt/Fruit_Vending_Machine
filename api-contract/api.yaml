            "format": "int32"
            "default": 0
            "minimum": 0
        -
          "name": "size"
          "in": "query"
          "description": "Page size 1..100."
          "required": false
          "schema":
            "type": "integer"
            "format": "int32"
            "default": 20
            "maximum": 100
            "minimum": 1
        -
          "name": "status"
