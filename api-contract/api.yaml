            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Not Found"
                timestamp: "2026-10-06T00:00:00Z"
                message: "Product not found"
                status: 404
                path: "/api/v1/products/{id}"
        "500":
          description: "Unexpected server error; no internal details"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Internal Server Error"
                timestamp: "2026-10-06T00:00:00Z"
                message: "An unexpected error occurred"
                status: 500
                path: "/api/v1/products/{id}"
      security:
        -
          bearerAuth: []
  "/api/v1/products/{id}/status":
    patch:
      tags:
        - "Products"
      summary: "Activate/deactivate catalog product"
      description: "ADMIN only. Sets ACTIVE or INACTIVE, preserving identity and all related history. INACTIVE disables future operational use, not deletion. Same-status requests are idempotent. No inventory/batch/order changes or hard deletion."
      operationId: "updateProductStatus"
      parameters:
        -
          name: "id"
          in: "path"
          description: "Product UUID."
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/UpdateProductStatusRequest"
            example:
              status: "INACTIVE"
        required: true
      responses:
        "200":
          description: "Product with current catalog status"
          headers:
            Cache-Control:
              schema:
                type: "string"
                const: "no-store"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiResponseProductResponse"
              example:
                timestamp: "2026-10-06T00:00:00Z"
                data:
                  createdAt: "2026-10-06T00:00:00Z"
                  price: 35000
                  imageUrl: "https://example.com/products/mango.jpg"
                  name: "Mango Fruit Box"
                  description: "Fresh prepared mango"
                  id: "c6a33ea7-0c1c-4bbf-a890-3b7286d10a02"
                  sku: "MANGO-BOX-001"
                  status: "INACTIVE"
                  updatedAt: "2026-10-06T00:00:00Z"
                message: "Product status updated"
        "400":
          description: "Invalid parameters, validation failure or malformed/unknown JSON fields"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Bad Request"
                timestamp: "2026-10-06T00:00:00Z"
                message: "Request body is missing or malformed"
                status: 400
                path: "/api/v1/products/{id}/status"
        "401":
          description: "Missing/invalid/expired Bearer token or unavailable account"
          headers:
            WWW-Authenticate:
              schema:
                type: "string"
                const: "Bearer"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Unauthorized"
                timestamp: "2026-10-06T00:00:00Z"
                message: "Authentication required or access token invalid"
                status: 401
                path: "/api/v1/products/{id}/status"
        "403":
          description: "Authenticated account lacks the required role"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Forbidden"
                timestamp: "2026-10-06T00:00:00Z"
                message: "Access denied"
                status: 403
                path: "/api/v1/products/{id}/status"
        "404":
          description: "Product not found"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Not Found"
                timestamp: "2026-10-06T00:00:00Z"
                message: "Product not found"
                status: 404
                path: "/api/v1/products/{id}/status"
        "500":
          description: "Unexpected server error; no internal details"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Internal Server Error"
                timestamp: "2026-10-06T00:00:00Z"
                message: "An unexpected error occurred"
                status: 500
                path: "/api/v1/products/{id}/status"
      security:
        -
          bearerAuth: []
  "/api/v1/products":
    get:
      tags:
        - "Products"
      summary: "List/search catalog products"
      description: "ADMIN or STAFF. Database pagination with combined optional status and case-insensitive literal substring search on name/SKU. Default page 0, size 20; maximum size 100. One sort field/direction using Spring conventions, default createdAt,desc; UUID ascending tie-break. Both statuses are visible by default; out-of-range pages are empty."
      operationId: "listProducts"
      parameters:
        -
          name: "page"
          in: "query"
          description: "Zero-based page index."
          required: false
          schema:
            type: "integer"
            format: "int32"
            default: 0
            minimum: 0
        -
          name: "size"
          in: "query"
          description: "Page size, 1 to 100."
          required: false
          schema:
            type: "integer"
            format: "int32"
            default: 20
            maximum: 100
            minimum: 1
        -
          name: "status"
          in: "query"
          description: "Optional ACTIVE or INACTIVE filter."
          required: false
          schema:
            type: "string"
            enum:
              - "ACTIVE"
              - "INACTIVE"
        -
          name: "search"
          in: "query"
          description: "Optional literal substring of name/SKU, case-insensitive, stripped; blank means no filter. Maximum 200 characters."
          required: false
          schema:
            type: "string"
            maxLength: 200
            minLength: 0
        -
          name: "sort"
          in: "query"
          description: "One approved field: id, sku, name, price, status, createdAt, updatedAt; optional asc/desc (asc when omitted). Example name,asc."
          required: false
          schema:
            type: "string"
            default: "createdAt,desc"
      responses:
        "200":
          description: "Paginated catalog products"
          headers:
            Cache-Control:
              schema:
                type: "string"
                const: "no-store"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiResponseProductPageResponse"
              example:
                timestamp: "2026-10-06T00:00:00Z"
                data:
                  content:
                    -
                      status: "ACTIVE"
                      sku: "MANGO-BOX-001"
                      id: "c6a33ea7-0c1c-4bbf-a890-3b7286d10a02"
                      imageUrl: "https://example.com/products/mango.jpg"
                      price: 35000
                      name: "Mango Fruit Box"
                      updatedAt: "2026-10-06T00:00:00Z"
                      createdAt: "2026-10-06T00:00:00Z"
                      description: "Fresh prepared mango"
                  size: 20
                  page: 0
                  totalPages: 1
                  totalElements: 1
                message: "Products retrieved"
        "400":
          description: "Invalid parameters, validation failure or malformed/unknown JSON fields"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Bad Request"
                timestamp: "2026-10-06T00:00:00Z"
                message: "Request body is missing or malformed"
                status: 400
                path: "/api/v1/products"
        "401":
          description: "Missing/invalid/expired Bearer token or unavailable account"
          headers:
            WWW-Authenticate:
              schema:
                type: "string"
                const: "Bearer"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Unauthorized"
                timestamp: "2026-10-06T00:00:00Z"
                message: "Authentication required or access token invalid"
                status: 401
                path: "/api/v1/products"
        "403":
          description: "Authenticated account lacks the required role"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Forbidden"
                timestamp: "2026-10-06T00:00:00Z"
                message: "Access denied"
                status: 403
                path: "/api/v1/products"
        "500":
          description: "Unexpected server error; no internal details"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Internal Server Error"
                timestamp: "2026-10-06T00:00:00Z"
                message: "An unexpected error occurred"
                status: 500
                path: "/api/v1/products"
      security:
        -
          bearerAuth: []
    post:
      tags:
        - "Products"
      summary: "Create catalog product"
      description: "ADMIN only. Creates ACTIVE product with stripped/uppercased unique SKU and positive BigDecimal price. Only sku/name/description/price/imageUrl are accepted. Status/id/timestamps/batch/inventory fields are rejected. Price is at most 9999999999.99 and two decimal places; no silent rounding. Database UNIQUE protects concurrent creates."
      operationId: "createProduct"
      requestBody:
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CreateProductRequest"
            example:
              price: 35000
              imageUrl: "https://example.com/products/mango.jpg"
              name: "Mango Fruit Box"
              description: "Fresh prepared mango"
              sku: "MANGO-BOX-001"
        required: true
      responses:
        "201":
          description: "ACTIVE product created; Location points to the product"
          headers:
            Cache-Control:
              schema:
                type: "string"
                const: "no-store"
            Location:
              description: "Relative URL of the created product."
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiResponseProductResponse"
              example:
                timestamp: "2026-10-06T00:00:00Z"
                data:
                  createdAt: "2026-10-06T00:00:00Z"
                  price: 35000
                  imageUrl: "https://example.com/products/mango.jpg"
                  name: "Mango Fruit Box"
                  description: "Fresh prepared mango"
                  id: "c6a33ea7-0c1c-4bbf-a890-3b7286d10a02"
                  sku: "MANGO-BOX-001"
                  status: "ACTIVE"
                  updatedAt: "2026-10-06T00:00:00Z"
                message: "Product created"
        "400":
          description: "Invalid parameters, validation failure or malformed/unknown JSON fields"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Bad Request"
                timestamp: "2026-10-06T00:00:00Z"
                message: "Request body is missing or malformed"
                status: 400
                path: "/api/v1/products"
        "401":
          description: "Missing/invalid/expired Bearer token or unavailable account"
          headers:
            WWW-Authenticate:
              schema:
                type: "string"
                const: "Bearer"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Unauthorized"
                timestamp: "2026-10-06T00:00:00Z"
                message: "Authentication required or access token invalid"
                status: 401
                path: "/api/v1/products"
        "403":
          description: "Authenticated account lacks the required role"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Forbidden"
                timestamp: "2026-10-06T00:00:00Z"
                message: "Access denied"
                status: 403
                path: "/api/v1/products"
        "409":
          description: "SKU already exists or concurrent database uniqueness conflict"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Conflict"
                timestamp: "2026-10-06T00:00:00Z"
                message: "SKU is already in use"
                status: 409
                path: "/api/v1/products"
        "500":
          description: "Unexpected server error; no internal details"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
              example:
                error: "Internal Server Error"
                timestamp: "2026-10-06T00:00:00Z"
                message: "An unexpected error occurred"
                status: 500
                path: "/api/v1/products"
      security:
        -
          bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Paste the access token only (without the Bearer prefix).
  schemas:
    "InventoryTransactionResponse":
      "type": "object"
      "description": "Append-only per-item history. Location snapshots, actor UUID, grouping reference, reason/status snapshots; legacy fields may be null. Each row represents one box; no aggregate quantity column."
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "inventoryItemId":
          "type": "string"
          "format": "uuid"
        "batchId":
          "type": "string"
          "format": "uuid"
        "batchCode":
          "type": "string"
        "machineId":
          "type": "string"
          "format": "uuid"
        "slotId":
          "type": "string"
          "format": "uuid"
        "type":
          "type": "string"
          "enum":
            - "LOAD"
            - "RESERVE"
            - "SALE"
            - "EXPIRE"
            - "REMOVE"
            - "RETURN"
            - "ADJUSTMENT"
        "referenceId":
          "type": "string"
          "format": "uuid"
        "performedBy":
          "type": "string"
          "format": "uuid"
        "reason":
          "type": "string"
        "statusBefore":
          "type": "string"
          "enum":
            - "AVAILABLE"
            - "RESERVED"
            - "SOLD"
            - "EXPIRED"
            - "REMOVED"
            - "DISPENSE_FAILED"
        "statusAfter":
          "type": "string"
          "enum":
            - "AVAILABLE"
            - "RESERVED"
            - "SOLD"
            - "EXPIRED"
            - "REMOVED"
            - "DISPENSE_FAILED"
        "createdAt":
          "type": "string"
          "format": "date-time"
    "InventoryTransactionPageResponse":
      "type": "object"
      "properties":
        "content":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/InventoryTransactionResponse"
        "page":
          "type": "integer"
          "format": "int32"
        "size":
          "type": "integer"
          "format": "int32"
        "totalElements":
          "type": "integer"
          "format": "int64"
        "totalPages":
          "type": "integer"
          "format": "int32"
    "ApiResponseInventoryTransactionPageResponse":
      "type": "object"
      "properties":
        "timestamp":
          "type": "string"
          "format": "date-time"
        "message":
          "type": "string"
        "data":
          "$ref": "#/components/schemas/InventoryTransactionPageResponse"
    "InventorySummaryResponse":
      "type": "object"
      "description": "DB counts at asOf: occupied AVAILABLE/RESERVED/EXPIRED/DISPENSE_FAILED; available AVAILABLE+unexpired; sellable additionally ACTIVE product/machine/slot; expiredCount counts physically present expired boxes. Remaining capacity clamped at zero for legacy overcapacity."
      "properties":
        "machineId":
          "type": "string"
          "format": "uuid"
        "slotId":
          "type": "string"
          "format": "uuid"
        "capacity":
          "type": "integer"
          "format": "int32"
        "occupiedCount":
          "type": "integer"
          "format": "int64"
        "availableCount":
          "type": "integer"
          "format": "int64"
        "expiredCount":
          "type": "integer"
          "format": "int64"
        "reservedCount":
          "type": "integer"
          "format": "int64"
        "sellableCount":
          "type": "integer"
          "format": "int64"
        "remainingCapacity":
          "type": "integer"
          "format": "int64"
        "asOf":
          "type": "string"
          "format": "date-time"
    "ApiResponseInventorySummaryResponse":
      "type": "object"
      "properties":
        "timestamp":
          "type": "string"
          "format": "date-time"
        "message":
          "type": "string"
        "data":
          "$ref": "#/components/schemas/InventorySummaryResponse"
    "InventoryPageResponse":
      "type": "object"
      "properties":
        "content":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/InventoryItemResponse"
        "page":
          "type": "integer"
          "format": "int32"
        "size":
          "type": "integer"
          "format": "int32"
        "totalElements":
          "type": "integer"
          "format": "int64"
        "totalPages":
          "type": "integer"
          "format": "int32"
    "ApiResponseInventoryPageResponse":
      "type": "object"
      "properties":
        "timestamp":
          "type": "string"
          "format": "date-time"
        "message":
          "type": "string"
        "data":
          "$ref": "#/components/schemas/InventoryPageResponse"
    "InventoryLoadResponse":
      "type": "object"
      "description": "One server-generated operationId shared as reference_id by the N per-item LOAD history rows; not an idempotency key."
      "properties":
        "operationId":
          "type": "string"
          "format": "uuid"
        "quantity":
          "type": "integer"
          "format": "int32"
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/InventoryItemResponse"
    "ApiResponseInventoryLoadResponse":
      "type": "object"
      "properties":
        "timestamp":
          "type": "string"
          "format": "date-time"
        "message":
          "type": "string"
        "data":
          "$ref": "#/components/schemas/InventoryLoadResponse"
    "LoadInventoryRequest":
      "type": "object"
      "additionalProperties": false
      "description": "Registers physically loaded and confirmed boxes. No hardware action. Creator comes from JWT; unknown fields rejected."
      "properties":
        "batchId":
          "type": "string"
          "format": "uuid"
        "slotId":
          "type": "string"
          "format": "uuid"
        "quantity":
          "type": "integer"
          "format": "int32"
          "description": "JSON integer token, 1..1000 per request; bounded bulk operation, independent of hardware capacity."
          "example": 4
          "exclusiveMinimum": 0
          "maximum": 1000
          "minimum": 1
      "required":
        - "batchId"
        - "quantity"
        - "slotId"
    "InventoryItemResponse":
      "type": "object"
      "description": "One physical box; nullable location for legacy off-machine rows. Expired is derived from batch expiry at request time, independent of stored status."
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "batchId":
          "type": "string"
          "format": "uuid"
        "batchCode":
          "type": "string"
        "productId":
          "type": "string"
          "format": "uuid"
        "productName":
          "type": "string"
        "machineId":
          "type": "string"
          "format": "uuid"
        "slotId":
          "type": "string"
          "format": "uuid"
        "slotCode":
          "type": "string"
        "status":
          "type": "string"
          "enum":
            - "AVAILABLE"
            - "RESERVED"
            - "SOLD"
            - "EXPIRED"
            - "REMOVED"
            - "DISPENSE_FAILED"
        "expiresAt":
          "type": "string"
          "format": "date-time"
        "expired":
          "type": "boolean"
        "loadedAt":
          "type": "string"
          "format": "date-time"
        "removedAt":
          "type": "string"
          "format": "date-time"
        "createdAt":
          "type": "string"
          "format": "date-time"
        "updatedAt":
          "type": "string"
          "format": "date-time"
    "ApiResponseInventoryItemResponse":
      "type": "object"
      "properties":
        "timestamp":
          "type": "string"
          "format": "date-time"
        "message":
          "type": "string"
        "data":
          "$ref": "#/components/schemas/InventoryItemResponse"
    "RemoveInventoryRequest":
      "type": "object"
      "additionalProperties": false
      "description": "Confirms physical removal; reason is stored on append-only per-item history. Actor is server-controlled."
      "properties":
        "reason":
          "type": "string"
          "description": "Nonblank reason, stripped, maximum 500 characters."
          "example": "Expired fruit removed during maintenance"
          "maxLength": 500
          "minLength": 1
      "required":
        - "reason"
    "ApiResponseProductBatchPageResponse":
      "type": "object"
      "properties":
        "timestamp":
          "type": "string"
          "format": "date-time"
        "message":
          "type": "string"
        "data":
          "$ref": "#/components/schemas/ProductBatchPageResponse"
    "ApiResponseProductBatchResponse":
      "type": "object"
      "properties":
        "timestamp":
          "type": "string"
          "format": "date-time"
        "message":
          "type": "string"
        "data":
          "$ref": "#/components/schemas/ProductBatchResponse"
    "ProductBatchPageResponse":
      "type": "object"
      "description": "Database page of batch DTOs; out-of-range pages have empty content."
      "properties":
        "content":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/ProductBatchResponse"
        "page":
          "type": "integer"
          "format": "int32"
        "size":
          "type": "integer"
          "format": "int32"
        "totalElements":
          "type": "integer"
          "format": "int64"
        "totalPages":
          "type": "integer"
          "format": "int32"
    "ProductBatchResponse":
      "type": "object"
      "description": "Immutable batch traceability; product SKU/name are current catalog values. UTC timestamps; no entity collections or stock counters."
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "batchCode":
          "type": "string"
        "productId":
          "type": "string"
          "format": "uuid"
        "productSku":
          "type": "string"
        "productName":
          "type": "string"
        "manufacturedAt":
          "type": "string"
          "format": "date-time"
        "expiresAt":
          "type": "string"
          "format": "date-time"
        "quantity":
          "type": "integer"
          "format": "int32"
          "description": "Original declared quantity, never current available stock."
        "createdBy":
          "type":
            - "string"
            - "null"
          "format": "uuid"
          "description": "Creator UUID, set from authenticated user for new batches; null for legacy rows without a creator."
        "createdAt":
          "type": "string"
          "format": "date-time"
    "CreateProductBatchRequest":
      "type": "object"
      "additionalProperties": false
      "description": "Create immutable traceability batch. Creator and creation time are server-controlled; no inventory is created."
      "properties":
        "batchCode":
          "type": "string"
          "description": "Globally unique, immutable code, stripped and uppercased with Locale.ROOT."
          "example": "MANGO-20261010-01"
          "maxLength": 64
          "minLength": 1
        "productId":
          "type": "string"
          "format": "uuid"
          "description": "Existing ACTIVE product UUID."
        "manufacturedAt":
          "type": "string"
          "format": "date-time"
          "description": "Preparation time, ISO-8601 string with Z or explicit offset; normalized to UTC, truncated to database microseconds."
          "example": "2026-10-10T01:00:00Z"
        "expiresAt":
          "type": "string"
          "format": "date-time"
          "description": "Expiration instant, strictly after preparation and current server time. Same offset/precision rules as manufacturedAt."
          "example": "2026-10-12T01:00:00Z"
        "quantity":
          "type": "integer"
          "format": "int32"
          "description": "Original declared units, not current stock. JSON integer token only, 1 through 2147483647."
          "example": 20
          "exclusiveMinimum": 0
          "maximum": 2147483647
          "minimum": 1
      "required":
        - "batchCode"
        - "expiresAt"
        - "manufacturedAt"
        - "productId"
        - "quantity"
    "UpdateMachineSlotRequest":
      "type": "object"
      "additionalProperties": false
      "description": "Replace capacity only. Identity, parent, slot code, status and timestamps are rejected."
      "properties":
        "capacity":
          "type": "integer"
          "format": "int32"
          "description": "Maximum physical capacity, not current stock. Positive 32-bit integer. Inventory occupancy checks are deferred to Inventory Management."
          "example": 8
          "exclusiveMinimum": 0
          "maximum": 2147483647
          "minimum": 1
      "required":
        - "capacity"
    "ApiResponseMachineSlotResponse":
      "type": "object"
      "properties":
        "timestamp":
          "type": "string"
