          "type": "string"
          "format": "uuid"
        "orderId":
          "type": "string"
          "format": "uuid"
        "provider":
          "type": "string"
          "description": "Active provider code, for example MOCK."
          "example": "MOCK"
        "status":
          "type": "string"
          "enum":
            - "PENDING"
            - "SUCCESS"
            - "FAILED"
            - "EXPIRED"
            - "REFUNDED"
