    "InventorySummaryResponse":
      "type": "object"
      "description": "DB counts at asOf: occupied AVAILABLE/RESERVED/EXPIRED/DISPENSE_FAILED; available AVAILABLE+unexpired; sellable additionally ACTIVE product/machine/slot; expiredCount counts physically present expired boxes. Remaining capacity clamped at zero for legacy overcapacity."
