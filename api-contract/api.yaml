  "/api/v1/kiosk/orders/{orderId}/payments":
    "post":
      "tags":
        - "Kiosk Payments"
      "summary": "Create or reuse a payment attempt (QR) for an order"
      "description": "KIOSK only, no request body. The amount is always the order total. A live PENDING attempt with a QR is reused (200); otherwise a new attempt is created (201): step 1 validates and inserts in a transaction, step 2 calls the configured provider with no transaction open, step 3 records the result. The attempt deadline is min(order expiresAt, now + attempt TTL), so a QR never outlives the reservation. Poll GET /api/v1/kiosk/orders/{orderId} every 2-3 seconds for status. Provider failure or timeout marks the attempt FAILED and returns 502; the order is unchanged. With provider PAYOS the qrCode is a VietQR payload and only whole-VND amounts are accepted: a fractional order amount (for example 35000.50) is never rounded and returns 409 before any attempt is created."
      "operationId": "createKioskPayment"
      "parameters":
        -
          "name": "orderId"
          "in": "path"
          "description": "Order UUID of this machine."
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "responses":
        "201":
          "description": "New attempt created with a QR"
          "headers":
            "Cache-Control":
              "schema":
                "type": "string"
                "const": "no-store"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiResponseKioskPaymentResponse"
              "example":
                "message": "Success"
                "data":
                  "paymentId": "5d6e0000-0000-4000-8000-000000000001"
                  "orderId": "e0f1a2b3-0000-4000-8000-000000000001"
                  "provider": "MOCK"
                  "status": "PENDING"
                  "amount": 70000.0
                  "qrCode": "MOCK-QR|MOCK-8F3KQ2AB|70000.00"
                  "expiresAt": "2026-10-15T04:05:00Z"
                "timestamp": "2026-10-15T04:00:00Z"
        "200":
          "description": "Existing live attempt reused"
          "headers":
            "Cache-Control":
              "schema":
                "type": "string"
                "const": "no-store"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiResponseKioskPaymentResponse"
              "example":
                "message": "Success"
                "data":
                  "paymentId": "5d6e0000-0000-4000-8000-000000000001"
                  "orderId": "e0f1a2b3-0000-4000-8000-000000000001"
                  "provider": "MOCK"
                  "status": "PENDING"
                  "amount": 70000.0
                  "qrCode": "MOCK-QR|MOCK-8F3KQ2AB|70000.00"
                  "expiresAt": "2026-10-15T04:05:00Z"
                "timestamp": "2026-10-15T04:00:00Z"
        "404":
          "description": "Missing order or order of another machine"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiErrorResponse"
              "example":
                "status": 404
                "message": "Payment not found"
                "timestamp": "2026-10-15T04:00:00Z"
                "error": "Not Found"
                "path": "/api/v1/kiosk/orders/{orderId}/payments"
        "409":
          "description": "Order not PENDING_PAYMENT, hold almost expired, attempt creation in flight, maximum attempts reached, order amount not chargeable by the provider (for example non-integer VND for PAYOS) or order cancelled during the provider call"
