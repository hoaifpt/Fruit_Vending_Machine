          "type":
            - "string"
            - "null"
          "format": "uuid"
        "slotCode":
          "type":
            - "string"
            - "null"
          "description": "A or B; null for RESET."
        "operation":
          "type": "string"
          "enum":
            - "REMOVE_ITEM"
            - "EMPTY_COLUMN"
            - "OPEN_REFILL"
            - "CLOSE_REFILL"
            - "RESET"
        "status":
          "type": "string"
          "enum":
            - "PENDING"
            - "SENT"
            - "ACCEPTED"
            - "COMPLETED"
            - "FAILED"
            - "NEEDS_RECONCILIATION"
            - "RECONCILED"
        "reason":
          "type":
            - "string"
            - "null"
          "enum":
            - "EXPIRED"
            - "DAMAGED"
            - "DISPENSE_FAILED"
            - "RESTOCK"
            - "INSPECTION"
            - "OTHER"
        "note":
          "type":
            - "string"
            - "null"
        "targetItem":
          "type": "null"
          "$ref": "#/components/schemas/MaintenanceTargetItem"
          "description": "REMOVE_ITEM: the head bowl when the command was created."
        "requestedBy":
          "$ref": "#/components/schemas/MaintenanceActor"
        "workOrderId":
          "type":
            - "string"
            - "null"
          "format": "uuid"
          "description": "Issue #68: work order the command serves."
        "attemptCount":
          "type": "integer"
          "format": "int32"
          "description": "Deliveries to the broker (re-sends use the same commandCode)."
        "createdAt":
          "type": "string"
          "format": "date-time"
        "sentAt":
          "type":
            - "string"
            - "null"
          "format": "date-time"
        "acceptedAt":
          "type":
            - "string"
            - "null"
          "format": "date-time"
        "finishedAt":
          "type":
            - "string"
            - "null"
          "format": "date-time"
        "failureReason":
          "type":
            - "string"
            - "null"
          "description": "ACCEPT_TIMEOUT, COMPLETE_TIMEOUT, HEAD_CHANGED, ACCEPTED_AFTER_TIMEOUT, CONTROLLER_FAULT, ABORTED[_<reason>] or a contract reason."
        "removedCount":
          "type":
            - "integer"
            - "null"
          "format": "int32"
          "description": "Bowls taken out of inventory by this command."
        "reconciliationOutcome":
          "type":
            - "string"
            - "null"
          "enum":
            - "DONE"
            - "NOT_DONE"
        "reconciledBy":
          "type": "null"
          "$ref": "#/components/schemas/MaintenanceActor"
        "reconciledAt":
          "type":
            - "string"
            - "null"
          "format": "date-time"
