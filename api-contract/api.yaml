    "CreateOrderRequest":
      "type": "object"
      "additionalProperties": false
      "description": "Kiosk order for exactly ONE fruit bowl (one purchase = one bowl). The machine comes from the kiosk credential, the price from the database and the physical bowl is chosen by the backend; items, quantity, machineId, price, status, orderCode and slot/inventory ids are rejected as unknown fields. Breaking change of issue #35: the former items[] shape is no longer accepted."
      "properties":
        "productId":
          "type": "string"
          "format": "uuid"
          "description": "Product UUID from the kiosk catalog."
          "example": "1c2d3e4f-0000-4000-8000-000000000001"
      "required":
        - "productId"
    "ApiResponseKioskOrderResponse":
      "type": "object"
      "properties":
        "timestamp":
          "type": "string"
          "format": "date-time"
        "message":
          "type": "string"
        "data":
          "$ref": "#/components/schemas/KioskOrderResponse"
    "KioskOrderResponse":
      "type": "object"
      "description": "Order as seen by the owning kiosk. A PENDING_PAYMENT order past expiresAt may be returned until the sweep runs; use expiresAt for the countdown."
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "orderCode":
          "type": "string"
        "machineId":
          "type": "string"
          "format": "uuid"
        "status":
          "type": "string"
          "enum":
            - "PENDING_PAYMENT"
            - "PAID"
            - "DISPENSING"
            - "COMPLETED"
            - "CANCELLED"
            - "PAYMENT_FAILED"
            - "DISPENSE_FAILED"
            - "REFUNDED"
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/KioskOrderItemResponse"
        "subtotal":
          "type": "number"
        "totalAmount":
          "type": "number"
        "createdAt":
          "type": "string"
          "format": "date-time"
        "expiresAt":
          "type": "string"
          "format": "date-time"
        "cancelledAt":
          "type": "string"
          "format": "date-time"
        "currentPayment":
          "type": "null"
          "$ref": "#/components/schemas/KioskPaymentResponse"
          "description": "Most recent payment attempt, or null before the first attempt. Poll this endpoint every 2-3 seconds; after the webhook issue it also shows PAID."
