openapi: 3.1.0
info:
  title: FreshVend draft - current user
  version: draft
  description: >-
    Draft proposed by the frontend (issue FE 2.1); the backend has not implemented this endpoint.
    Backend issue #48 (permission-based authorization, V13__create_permissions.sql) defines the permission codes used
    below but does NOT add GET /auth/me, so the path still needs agreement with the backend.
    Used by the mock layer until the backend ships it, then this file is deleted and the path moves to api.yaml.
paths:
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Current account with roles and permissions
      description: >-
        Any authenticated ADMIN or STAFF. Lets the web learn the display name and permissions without decoding the JWT.
        Roles and permissions are read from the database per request, so they are current even when the token is older.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAuthMeResponse"
        "401":
          description: Missing, invalid or expired access token, or the account is no longer ACTIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthMeResponse:
      type: object
      description: Safe account profile with effective permissions. No credentials or tokens.
      required: [id, email, fullName, status, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type:
            - string
            - "null"
        status:
          type: string
          enum: [ACTIVE, INACTIVE, LOCKED]
        roles:
          type: array
          description: Role names without the ROLE_ prefix, for example ADMIN.
          items:
            type: string
        permissions:
          type: array
          description: >-
            Effective permission codes of the account's roles, exactly the codes of backend #48 (table `permissions`).
            A write code does not imply its read code. Seed: ADMIN has all 15; STAFF has PRODUCT_READ, MACHINE_READ,
            BATCH_READ, BATCH_CREATE, INVENTORY_READ, INVENTORY_WRITE, ORDER_READ. The 15 codes of #48 are USER_READ,
            USER_WRITE, PERMISSION_MANAGE, PRODUCT_READ, PRODUCT_WRITE, MACHINE_READ, MACHINE_WRITE (machines and slots),
            KIOSK_CREDENTIAL_MANAGE, BATCH_READ, BATCH_CREATE, INVENTORY_READ, INVENTORY_WRITE, ORDER_READ, PAYMENT_READ,
            PAYMENT_WEBHOOK_LOG_READ. Later backend migrations may add codes, so this is not an enum; clients ignore codes
            they do not know.
          items:
            type: string
            pattern: "^[A-Z][A-Z0-9_]{2,63}$"
    ApiResponseAuthMeResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        data:
          $ref: "#/components/schemas/AuthMeResponse"
    ApiErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
