openapi: 3.1.0
info:
  title: FreshVend draft - current user
  version: draft
  description: >-
    Draft proposed by the frontend (issue FE 2.1); the backend has not implemented this endpoint.
    Used by the mock layer until the backend ships it, then this file is deleted and the path moves to api.yaml.
paths:
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Current account with roles and permissions
      description: >-
        Any authenticated ADMIN or STAFF. Lets the web learn the display name and permissions without decoding the JWT.
        Roles and permissions are read from the database per request, so they are current even when the token is older.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAuthMeResponse"
        "401":
          description: Missing, invalid or expired access token, or the account is no longer ACTIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthMeResponse:
      type: object
      description: Safe account profile with effective permissions. No credentials or tokens.
      required: [id, email, fullName, status, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type:
            - string
            - "null"
        status:
          type: string
          enum: [ACTIVE, INACTIVE, LOCKED]
        roles:
          type: array
          description: Role names without the ROLE_ prefix, for example ADMIN.
          items:
            type: string
        permissions:
          type: array
          description: >-
            Proposed resource:action names. ADMIN has users:manage, products:manage, machines:manage, slots:manage,
            kiosk-credentials:manage, batches:write, inventory:write, orders:read, payments:read, webhook-logs:read.
            STAFF has products:read, machines:read, slots:read, batches:write, inventory:write, orders:read.
          items:
            type: string
    ApiResponseAuthMeResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        data:
          $ref: "#/components/schemas/AuthMeResponse"
    ApiErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
