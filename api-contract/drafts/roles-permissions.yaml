openapi: 3.1.0
info:
  title: FreshVend draft - roles and permissions
  version: draft
  description: >-
    Copy of the role/permission API of backend issue #48 (branch feature/48-permission-authorization, not merged into dev):
    RoleController.java, PermissionController.java, dto/RoleResponse.java, dto/PermissionResponse.java,
    dto/ReplaceRolePermissionsRequest.java, service/RolePermissionService.java, V13__create_permissions.sql and
    RolePermissionApiIntegrationTest.java. Paths, shapes and status codes are taken from that branch unchanged.
    Used by the web screen A3 (FE 3.2) and the mock layer until #48 is merged; then the paths come from api.yaml and this
    file is deleted.
paths:
  /api/v1/permissions:
    get:
      tags: [Roles & Permissions]
      operationId: listPermissions
      summary: List all permissions
      description: Requires PERMISSION_MANAGE. The full catalog (code, description) sorted by code. Permissions are added by migrations only.
      security:
        - bearerAuth: []
      x-required-permission: PERMISSION_MANAGE
      responses:
        "200":
          description: Permission catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListPermissionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/v1/roles:
    get:
      tags: [Roles & Permissions]
      operationId: listRoles
      summary: List roles with their permissions
      description: Requires PERMISSION_MANAGE. Every role with its sorted permission codes (seed ADMIN, STAFF).
      security:
        - bearerAuth: []
      x-required-permission: PERMISSION_MANAGE
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListRoleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/v1/roles/{id}:
    get:
      tags: [Roles & Permissions]
      operationId: getRole
      summary: Get a role
      description: Requires PERMISSION_MANAGE. The role with its sorted permission codes.
      security:
        - bearerAuth: []
      x-required-permission: PERMISSION_MANAGE
      parameters:
        - $ref: "#/components/parameters/RoleId"
      responses:
        "200":
          description: Role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRoleResponse"
        "400":
          description: Malformed role UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/v1/roles/{id}/permissions:
    put:
      tags: [Roles & Permissions]
      operationId: replaceRolePermissions
      summary: Replace the permission set of a role
      description: >-
        Requires PERMISSION_MANAGE. Replaces the whole set (an empty list leaves the role without access). Unknown or
        duplicate codes are rejected (400, codes listed in fieldErrors.permissions). The ADMIN role must keep
        PERMISSION_MANAGE and USER_WRITE (409). The role row is locked while replacing, so concurrent changes never lose
        an update. One audit_logs row ROLE_PERMISSIONS_CHANGED records the old and new sorted codes and the actor.
        Members get the new permissions on their next request; the JWT does not change. Order of checks: body (400),
        role (404), ADMIN guard (409).
      security:
        - bearerAuth: []
      x-required-permission: PERMISSION_MANAGE
      parameters:
        - $ref: "#/components/parameters/RoleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceRolePermissionsRequest"
      responses:
        "200":
          description: Role with its new permission set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRoleResponse"
        "400":
          description: >-
            Validation failure, unknown or duplicate codes, unknown JSON fields. Unknown codes: message
            "Unknown permission codes", fieldErrors.permissions "Unknown codes: A, B". Duplicates: message
            "Duplicate permission codes", fieldErrors.permissions "Duplicate codes: A".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: >-
            Would remove PERMISSION_MANAGE or USER_WRITE from ADMIN. Message: "The ADMIN role must keep PERMISSION_MANAGE and
            USER_WRITE; otherwise nobody could manage users or permissions" (order of Permissions.ADMIN_REQUIRED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RoleId:
      name: id
      in: path
      required: true
      description: Role UUID (seed ADMIN 10000000-0000-0000-0000-000000000001, STAFF 10000000-0000-0000-0000-000000000002).
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing/invalid/expired Bearer token or unavailable account
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Forbidden:
      description: Authenticated account lacks PERMISSION_MANAGE
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    ServerError:
      description: Unexpected server/configuration error; no internal details
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
  schemas:
    PermissionResponse:
      type: object
      description: A permission of the catalog. Permissions are reference data added by migrations, never through the API.
      properties:
        code:
          type: string
          description: Stable permission code checked by the backend.
          example: PRODUCT_WRITE
        description:
          type: string
          description: What the permission allows (English, from the permissions table).
          example: Create and update products and change product status
    RoleResponse:
      type: object
      description: A role and the permission codes it grants. Roles cannot be created, renamed or deleted through the API.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Role name (uppercase).
          example: STAFF
        description:
          type:
            - string
            - "null"
          description: Role description.
          example: Machine operations and inventory staff
        permissions:
          type: array
          description: Granted permission codes, sorted.
          example: [BATCH_CREATE, BATCH_READ, INVENTORY_READ]
          items:
            type: string
    ReplaceRolePermissionsRequest:
      type: object
      additionalProperties: false
      description: >-
        The complete new permission set of the role (replaces the old one). An empty list is allowed (role without
        access). Unknown or duplicate codes are rejected; the ADMIN role must keep PERMISSION_MANAGE and USER_WRITE.
      required: [permissions]
      properties:
        permissions:
          type: array
          description: Permission codes; no duplicates.
          minItems: 0
          maxItems: 200
          items:
            type: string
            minLength: 1
            description: Permission code from GET /api/v1/permissions.
            example: PRODUCT_READ
    ApiResponseListPermissionResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/PermissionResponse"
    ApiResponseListRoleResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/RoleResponse"
    ApiResponseRoleResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        data:
          $ref: "#/components/schemas/RoleResponse"
    ApiErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
