openapi: 3.1.0
info:
  title: FreshVend draft - public incident report
  version: draft
  description: >-
    Draft proposed by the frontend (issue FE 8.2, screen P1 / K-09 "Báo sự cố") for backend issue 5.2; the backend has
    not implemented this endpoint yet. SRS 3.6.4, table incident_reports (proposed migration V18), messages MSG46/47/48,
    rules BR-32 (rate limit) and BR-15 (a report never changes an order, payment or machine by itself). Used by the mock
    layer until the backend ships it, then this file is deleted and the path moves to api.yaml.


    The customer reaches the form by scanning the QR shown on the kiosk ("Báo sự cố" button). The QR carries the
    machine's public code in the query parameter `machine` (https://<web>/bao-su-co?machine=FV-HCM-001), never the
    internal machine id. Without a valid code the form asks the customer to type the code printed on the machine.


    Proposed storage (V18): incident_reports(id uuid pk, report_code varchar(32) unique, machine_id fk machines,
    order_id fk orders null, type varchar(32), description varchar(500) null, contact_phone varchar(20) null,
    photo_object_key varchar(255) null, photo_content_type varchar(64) null, client_fingerprint varchar(64) null (hash
    of the client IP, for rate limiting and abuse review only), order_flagged boolean, created_at timestamptz). The
    follow-up of a report is its INCIDENT work ticket (FE 8.3, drafts/work-tickets.yaml): the server opens one OPEN
    INCIDENT ticket per report in the same transaction, so assignment, progress and resolution use the ticket
    lifecycle; reports themselves have no status.


    FE 8.3 adds one admin read, GET /api/v1/incident-reports?flagged=true, so the refund screen (W-12 "Cần hoàn tiền")
    shows a "đã trả nhưng không nhận hàng" report as soon as it arrives, including for an order still PAID (which
    GET /orders?status=DISPENSE_FAILED would miss).
paths:
  /api/v1/incident-reports:
    get:
      tags: [IncidentReports]
      operationId: listIncidentReports
      summary: Customer reports for the admin (draft, FE 8.3)
      description: >-
        REFUND_RECORD (ADMIN only, draft permission of drafts/refunds.yaml; a later admin screen of reports may bring
        its own INCIDENT_READ). Newest first, database pagination page0/size20/max100. With flagged=true only the reports
        whose order was flagged (orderFlagged: the order was PAID or DISPENSE_FAILED when the report arrived) and whose
        order still holds a SUCCESS payment with no refund recorded, i.e. the reports an admin still has to check for a
        refund; once the payment is refunded the report leaves this list. Each row carries the order's current status
        and amount so the screen can tell "refund now" (DISPENSE_FAILED) from "check the machine first" (PAID,
        DISPENSING). Reading never changes the order, its payments or the report (BR-15).
      x-required-permission: REFUND_RECORD
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
        - name: flagged
          in: query
          description: Only reports with an order still to check for a refund (see above).
          required: false
          schema:
            type: boolean
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/IncidentType"
        - name: machineId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: sort
          in: query
          description: createdAt only, with optional asc/desc.
          required: false
          schema:
            type: string
            default: createdAt,desc
      responses:
        "200":
          description: One page of reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePageIncidentReportResponse"
        "400":
          description: Invalid parameter (unknown type, non-UUID id, unknown sort)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: The caller lacks REFUND_RECORD
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/v1/public/incident-reports:
    post:
      tags: [Public]
      operationId: createPublicIncidentReport
      summary: Customer reports an incident on a machine (draft, no authentication)
      description: >-
        Public endpoint, no Authorization header and no kiosk key (the request comes from the customer's phone).
        Sent as multipart/form-data with plain form fields so an optional photo travels in the same request (Spring
        @ModelAttribute with a MultipartFile; no JSON part, no separate upload step, no orphan files).


        Rules: `type` decides the required fields. PAID_NOT_RECEIVED requires `orderCode`; OTHER requires
        `description`; every other field is optional. When `orderCode` is sent (any type) it must be an order of the
        machine named by `machineCode`, otherwise 422 with fieldErrors.orderCode (MSG46 "Không tìm thấy mã đơn của máy
        này."). Text fields are stripped; blank optional fields count as absent. `machineCode` and `orderCode` are
        compared upper-cased (Locale.ROOT), like machine codes elsewhere.


        Effects (BR-15): the report is stored and, in the same transaction, the backend opens an OPEN INCIDENT work
        ticket for the machine (drafts/work-tickets.yaml, no assignee, created by "Hệ thống", linked to the report). It never changes
        the order, its payments, the inventory or the machine status. When the report names an order in PAID or
        DISPENSE_FAILED, that order is flagged for the admin's attention on screen W-12 (flag only; refunds stay a
        manual admin action). The answer never reveals anything about the order (status, amount) to the reporter.


        Rate limit (BR-32): at most 5 requests per minute per client (client IP after the trusted proxy), counted on
        every POST to this path whatever its outcome; the 6th within the window gets 429 with a Retry-After header in
        seconds (MSG48 "Bạn gửi quá nhiều báo cáo. Vui lòng thử lại sau một phút.").
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateIncidentReportForm"
            encoding:
              photo:
                contentType: image/jpeg, image/png, image/webp
      responses:
        "201":
          description: Report stored; the customer is shown MSG47 "Cảm ơn bạn. Mã báo cáo của bạn là {reportCode}."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseIncidentReportReceipt"
        "400":
          description: >-
            Validation failed, with fieldErrors keyed by form field (machineCode, type, orderCode, description,
            contactPhone, photo), including a missing field required by the chosen type, an unknown field and a photo
            that is not JPEG/PNG/WebP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: No machine has this machineCode (fieldErrors.machineCode is set).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "413":
          description: The photo is larger than 5 MB (or the whole request larger than 6 MB).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: orderCode is well formed but is not an order of this machine (fieldErrors.orderCode, MSG46).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429":
          description: More than 5 reports per minute from this client (MSG48).
          headers:
            Retry-After:
              description: Seconds until the client may send again.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
components:
  schemas:
    IncidentType:
      type: string
      description: >-
        PAID_NOT_RECEIVED "Đã trả tiền nhưng không nhận hàng", SPOILED_FRUIT "Trái cây hỏng", MACHINE_FAULT "Máy lỗi",
        OTHER "Khác".
      enum: [PAID_NOT_RECEIVED, SPOILED_FRUIT, MACHINE_FAULT, OTHER]
    CreateIncidentReportForm:
      type: object
      additionalProperties: false
      required: [machineCode, type]
      properties:
        machineCode:
          type: string
          description: Public machine code from the QR or printed on the machine; stripped and upper-cased.
          minLength: 1
          maxLength: 64
          examples: ["FV-HCM-001"]
        type:
          $ref: "#/components/schemas/IncidentType"
        orderCode:
          type: string
          description: Required when type is PAID_NOT_RECEIVED. Shown on the kiosk after payment.
          pattern: "^ORD-[0-9]{8}-[A-Z0-9]{8}$"
          examples: ["ORD-20261109-AB12CD34"]
        description:
          type: string
          description: Free text, at most 500 characters (UTF-16 units, as @Size counts). Required when type is OTHER.
          maxLength: 500
        contactPhone:
          type: string
          description: >-
            Optional Vietnamese mobile number so the operator can call back, sent normalised by the web as 0 followed by
            9 digits (+84/84 prefixes converted). Visible to admins only; never shown back to the reporter.
          pattern: "^0[35789][0-9]{8}$"
          examples: ["0912345678"]
        photo:
          type: string
          format: binary
          description: Optional single photo, JPEG, PNG or WebP, at most 5 MB. Stored by the backend (object storage), never served publicly.
    IncidentReportReceipt:
      type: object
      required: [reportCode, createdAt]
      properties:
        reportCode:
          type: string
          description: Code the customer can quote to support, "INC-" + creation date (same date convention as orderCode) + "-" + 4 upper-case letters/digits.
          pattern: "^INC-[0-9]{8}-[A-Z0-9]{4}$"
          examples: ["INC-20261109-7KQ2"]
        createdAt:
          type: string
          format: date-time
    IncidentReportResponse:
      type: object
      description: >-
        One report as the admin sees it. The order fields describe the order now (current status), not at report time.
        description is plain text written by a customer: show it as text, never as HTML.
      required: [id, reportCode, type, machineId, machineCode, orderFlagged, hasPhoto, createdAt]
      properties:
        id:
          type: string
          format: uuid
        reportCode:
          type: string
          examples: ["INC-20261109-7KQ2"]
        type:
          $ref: "#/components/schemas/IncidentType"
        machineId:
          type: string
          format: uuid
        machineCode:
          type: string
        orderId:
          type:
            - string
            - "null"
          format: uuid
        orderCode:
          type:
            - string
            - "null"
        orderStatus:
          type:
            - string
            - "null"
          description: Current status of the order (OrderDetailResponse.status of api.yaml), null without an order.
          enum: [PENDING_PAYMENT, PAID, DISPENSING, COMPLETED, CANCELLED, PAYMENT_FAILED, DISPENSE_FAILED, REFUNDED, null]
        orderTotalAmount:
          type:
            - number
            - "null"
          description: Order total in VND, null without an order.
        orderFlagged:
          type: boolean
        description:
          type:
            - string
            - "null"
        contactPhone:
          type:
            - string
            - "null"
          description: Optional number left by the customer (ADMIN only).
        hasPhoto:
          type: boolean
        ticketId:
          type:
            - string
            - "null"
          format: uuid
          description: The INCIDENT work ticket opened for this report.
        createdAt:
          type: string
          format: date-time
    PageIncidentReportResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/IncidentReportResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    ApiResponsePageIncidentReportResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        data:
          $ref: "#/components/schemas/PageIncidentReportResponse"
    ApiResponseIncidentReportReceipt:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        data:
          $ref: "#/components/schemas/IncidentReportReceipt"
    ApiErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
