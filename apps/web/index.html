<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Khám phá Fruit Vending — giải pháp máy bán trái cây tự động cho không gian làm việc và sinh hoạt. Tìm hiểu hợp tác đặt máy và truy cập Web quản lý." />
    <meta name="theme-color" content="#19392B" />
    <script>
      // Apply the saved light/dark choice before first paint (see src/lib/theme.ts).
      try { var t = localStorage.getItem('fruit-vending-theme'); if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark') } catch (e) {}
    </script>
    <title>Fruit Vending — Trái cây tươi. Gần bạn hơn.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
